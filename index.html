async function teacherClear() { if (!(await askBox({ title: '清除資料', text: '確定清除這台電腦所有勇者的資料？（學生的通關密碼還是能恢復進度）', ok: '清除' }))) return; profiles = {}; LS.set('kr_profiles', {}); toast('已清除'); showTitle(); }

// ---------- 按鍵分派 ----------
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (W && W.A && !W.A.isConnected) killWave(); // 挑戰畫面已經不在了，別讓它繼續吃按鍵
  if (W && W.onRaw) W.onRaw(e);
  if (W && W.onKey) {
    if (/INPUT|TEXTAREA/.test(tag)) return;
    if (e.ctrlKey || e.altKey || e.metaKey || !GAME_CODE(e.code)) return;
    e.preventDefault(); if (e.repeat) return; W.onKey(e); return;
  }
  if (W && W.onRaw) return;
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) { if (e.key === 'Enter' && UI.enter && !e.isComposing) { e.preventDefault(); UI.enter(); } return; }
  if (UI.dialogOpen) { if (['Space', 'Enter', 'NumpadEnter', 'ArrowUp', 'KeyE', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat && UI.dialogNext) UI.dialogNext(); } return; }
  if ($('modal').innerHTML) { if ((e.code === 'Escape' || e.code === 'KeyB' || e.code === 'KeyQ' || e.code === 'KeyM') && !window.closeBoard) closeModal(); else if (e.code === 'Escape' && window.closeBoard) closeBoard(); return; }
  if (e.key === 'Enter' && UI.enter && !world.visible) { e.preventDefault(); UI.enter(); return; }
  if (e.key === 'Enter' && UI.enter && $('ov').innerHTML) { e.preventDefault(); UI.enter(); return; }
  if (world.visible) { KEYS[e.code] = true; worldKeyDown(e); }
});
document.addEventListener('keyup', e => { KEYS[e.code] = false; });
let __stuckN = 0, __busyN = 0;
setInterval(() => {
  if (typeof world === 'undefined' || !world.visible || !me) { __stuckN = __busyN = 0; return; }
  const dlg = $('dialog');
  const nothingOnScreen = !UI.dialogOpen && (!dlg || dlg.classList.contains('hidden')) && !$('modal').innerHTML && !$('ov').innerHTML
    && !(typeof B !== 'undefined' && B.st) && !document.querySelector('.askbox') && !($('fade') && $('fade').classList.contains('on'));
  // 一般情況：沒有「忙碌中」卻不能動，1 秒後解鎖
  __stuckN = nothingOnScreen && !world.active && !UI.busy && !world.busy ? __stuckN + 1 : 0;
  if (__stuckN >= 3) { world.active = true; __stuckN = 0; }
  // 「忙碌中」的旗子沒被放下（某段劇情或視窗沒正常結束）：畫面空著超過 3 秒就強制放下
  __busyN = nothingOnScreen && (UI.busy || world.busy) ? __busyN + 1 : 0;
  if (__busyN >= 8) { UI.busy = false; world.busy = false; world.active = true; KEYS.ArrowLeft = KEYS.ArrowRight = KEYS.KeyA = KEYS.KeyD = false; __busyN = 0; console.warn('解除卡住'); }
}, 400);
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
// 挑戰或戰鬥中不小心按到 F5、關掉分頁時，先跳出確認（進度只存到上一個完成的任務）
addEventListener('beforeunload', e => { if (typeof me !== 'undefined' && me && world.visible && ($('ov').innerHTML || (typeof B !== 'undefined' && B.st))) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('contextmenu', e => { if (world.visible || $('ov').innerHTML) e.preventDefault(); });


const OFFLINE_TITLE = offlineTitleScreen, OFFLINE_TEACHER = showTeacher;
// =====================================================================
//  背景音樂：幾段原創 8-bit 小旋律，依場景自動切換
//  ‧村莊／小鎮、野外、洞窟城堡、一般戰鬥、魔王戰
//  ‧練習關卡、小遊戲、競技場對戰時自動安靜，讓學生專心（那些畫面有自己的音效）
//  ‧設定裡可以單獨關掉音樂；音效關掉時音樂也會停
// =====================================================================
const MUSIC = {
  // 每段 32 格（八分音符），數字是 MIDI 音高，0 是休止
  town: { ms: 260, lead: [65, 0, 69, 0, 72, 0, 69, 70, 72, 0, 74, 0, 72, 0, 0, 0, 70, 0, 69, 0, 67, 0, 65, 67, 69, 0, 67, 0, 65, 0, 0, 0],
    bass: [41, 0, 48, 0, 41, 0, 48, 0, 46, 0, 53, 0, 46, 0, 53, 0, 43, 0, 50, 0, 48, 0, 48, 0, 41, 0, 48, 0, 41, 0, 0, 0] },
  field: { ms: 200, lead: [72, 0, 76, 79, 77, 76, 74, 0, 72, 74, 76, 0, 79, 0, 76, 0, 77, 0, 81, 79, 77, 76, 74, 0, 76, 74, 72, 0, 67, 0, 72, 0],
    bass: [48, 0, 55, 0, 48, 0, 55, 0, 53, 0, 60, 0, 53, 0, 60, 0, 50, 0, 57, 0, 50, 0, 57, 0, 55, 0, 50, 0, 48, 0, 48, 0] },
  dark: { ms: 300, lead: [69, 0, 0, 72, 71, 0, 69, 0, 67, 0, 0, 69, 64, 0, 0, 0, 65, 0, 0, 69, 67, 0, 65, 0, 64, 0, 62, 0, 64, 0, 0, 0],
    bass: [45, 0, 0, 0, 45, 0, 0, 0, 43, 0, 0, 0, 43, 0, 0, 0, 41, 0, 0, 0, 41, 0, 0, 0, 40, 0, 0, 0, 40, 0, 0, 0] },
  battle: { ms: 150, lead: [74, 74, 0, 77, 0, 74, 72, 0, 70, 0, 72, 0, 74, 0, 69, 0, 74, 74, 0, 77, 0, 79, 81, 0, 79, 0, 77, 0, 76, 0, 74, 0],
    bass: [38, 50, 38, 50, 38, 50, 38, 50, 34, 46, 34, 46, 36, 48, 36, 48, 38, 50, 38, 50, 38, 50, 38, 50, 41, 53, 40, 52, 38, 50, 37, 49] },
  boss: { ms: 140, lead: [76, 0, 75, 76, 0, 79, 0, 76, 74, 0, 72, 0, 71, 0, 0, 0, 76, 0, 75, 76, 0, 79, 0, 83, 81, 0, 79, 0, 78, 0, 76, 0],
    bass: [40, 40, 52, 40, 40, 52, 40, 52, 36, 36, 48, 36, 38, 38, 50, 38, 40, 40, 52, 40, 40, 52, 40, 52, 35, 35, 47, 35, 35, 47, 35, 47] }
};
const MUS_DARK = ['cave', 'castle', 'ruin', 'lava', 'ash', 'void', 'frost'], MUS_TOWN = ['village', 'studio', 'gallery', 'tech'];
const MUS = { on: true, cur: null, step: 0, next: 0, gain: null, timer: 0 };
try { MUS.on = localStorage.getItem('kr_music') !== '0'; } catch (e) {}
function toggleMusic() { MUS.on = !MUS.on; try { localStorage.setItem('kr_music', MUS.on ? '1' : '0'); } catch (e) {} musWant(); return MUS.on; }
// 現在應該放哪一首（null＝安靜）
function musPick() {
  if (!MUS.on || muted || !me || !world || !world.visible || document.hidden) return null;
  const ov = $('ov') && $('ov').firstElementChild;
  if (ov) {
    if (ov.classList.contains('abattle')) return 'boss';
    if (ov.classList.contains('battle')) return B.st && B.st.M && B.st.M.boss ? 'boss' : 'battle';
    return null;   // 練習、小遊戲、競技場、商店：安靜
  }
  const th = world.A && world.A.theme;
  return MUS_DARK.includes(th) ? 'dark' : MUS_TOWN.includes(th) ? 'town' : 'field';
}
function musNote(m, t, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(440 * Math.pow(2, (m - 69) / 12), t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(MUS.gain); o.start(t); o.stop(t + dur + .02);
}
function musWant() {
  const want = musPick();
  if (want === MUS.cur) return;
  // 換曲：舊的淡出，新的從頭開始
  if (MUS.gain && AC) { const g = MUS.gain; try { g.gain.setTargetAtTime(0, AC.currentTime, .12); } catch (e) {} setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 800); MUS.gain = null; }
  MUS.cur = want; MUS.step = 0;
  if (!want) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    MUS.gain = AC.createGain(); MUS.gain.gain.value = 0; MUS.gain.connect(AC.destination);
    MUS.gain.gain.setTargetAtTime(1, AC.currentTime, .3);
    MUS.next = AC.currentTime + .1;
  } catch (e) { MUS.cur = null; }
}
// 每 0.1 秒排好接下來 0.3 秒的音符（用音訊時鐘排，節拍才穩）
function musTick() {
  if (!MUS.cur || !MUS.gain || !AC) return;
  const M = MUSIC[MUS.cur], len = M.ms / 1000;
  if (MUS.next < AC.currentTime - .5) MUS.next = AC.currentTime + .05;   // 分頁在背景太久：重新對齊
  while (MUS.next < AC.currentTime + .3) {
    const i = MUS.step++ % M.lead.length, t = MUS.next;
    if (M.lead[i]) musNote(M.lead[i], t, len * .9, 'square', .022);
    if (M.bass[i]) musNote(M.bass[i], t, len * 1.6, 'triangle', .05);
    MUS.next += len;
  }
}
setInterval(() => { try { musWant(); musTick(); } catch (e) {} }, 100);

(window.BOOT || showTitle)();

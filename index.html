<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍵盤勇者 RPG</title>
<style>
:root{--ink:#2b1d14;--paper:#f4e4c1;--paper2:#dcc193;--hi:#fff8e6;--gold:#e8b04a;--u:3px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a1220;color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
input,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
.hidden{display:none!important}

/* 像素框與按鈕 */
.px{background:var(--paper);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 var(--paper2),inset 4px 4px 0 var(--hi),0 6px 0 rgba(0,0,0,.4)}
.pdark{background:#2a1f33;color:#f4e4c1;border:4px solid #0d0912;box-shadow:inset -4px -4px 0 #1b1424,inset 4px 4px 0 #43364f,0 6px 0 rgba(0,0,0,.4)}
.pbtn{font-weight:900;font-size:18px;padding:8px 16px;background:#e8b04a;border:4px solid var(--ink);box-shadow:inset -4px -4px 0 #b47d26,inset 4px 4px 0 #ffe3a3;white-space:nowrap}
.pbtn:hover:not(:disabled){filter:brightness(1.08)}
.pbtn:active:not(:disabled){transform:translateY(2px)}
.pbtn.green{background:#7cc456;box-shadow:inset -4px -4px 0 #4e8a31,inset 4px 4px 0 #b8ef90}
.pbtn.red{background:#e0675a;box-shadow:inset -4px -4px 0 #a8433a,inset 4px 4px 0 #ffa79c;color:#fff}
.pbtn.blue{background:#5aa7e0;box-shadow:inset -4px -4px 0 #3a77a8,inset 4px 4px 0 #a9d8ff}
.pbtn.gray{background:#b3a99a;box-shadow:inset -4px -4px 0 #857b6d,inset 4px 4px 0 #ddd5c9}
.pbtn.small{font-size:14px;padding:4px 10px;border-width:3px}
.pbtn:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.big{font-size:24px;padding:12px 26px}

/* 舞台 */
#root{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#stage{position:relative;overflow:hidden;border:4px solid #0d0912;box-shadow:0 0 0 4px #43364f,0 20px 40px rgba(0,0,0,.6)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hint{color:#d8c7a6;font-weight:800;font-size:15px;letter-spacing:1px}
#hint b{color:#ffe3a3;background:#43364f;padding:0 6px;border-radius:3px;margin:0 2px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
#fade.on{opacity:1}

/* 世界 HUD */
#whud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(var(--u)*2);pointer-events:none;font-size:calc(var(--u)*4.6)}
#whud .box{pointer-events:auto;background:rgba(26,18,32,.82);color:#f4e4c1;border:calc(var(--u)*1) solid #0d0912;box-shadow:inset 0 0 0 calc(var(--u)*.7) #43364f;padding:calc(var(--u)*1.5) calc(var(--u)*2.5)}
#whud .stat{display:flex;flex-direction:column;gap:calc(var(--u)*.8);min-width:calc(var(--u)*62)}
#whud .row{display:flex;align-items:center;gap:calc(var(--u)*2);font-weight:900}
.bar{flex:1;height:calc(var(--u)*3.2);background:#0d0912;border:calc(var(--u)*.6) solid #0d0912;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#e0675a;transition:width .3s}
.bar.exp i{background:#5aa7e0}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.6);color:#fff;text-shadow:0 1px 0 #000}
#whud .quest{max-width:calc(var(--u)*120);text-align:right}
#whud .quest .qt{color:#ffe3a3;font-weight:900}
#whud .quest .qg{font-size:calc(var(--u)*3.8);font-weight:700;margin-top:2px}
#whud .btns{display:flex;gap:calc(var(--u)*1.2);justify-content:flex-end;margin-top:calc(var(--u)*1.5);pointer-events:auto}
#whud .btns button{font-size:calc(var(--u)*3.8);font-weight:900;background:#f4e4c1;border:calc(var(--u)*.8) solid #0d0912;padding:calc(var(--u)*.6) calc(var(--u)*1.8);box-shadow:inset -3px -3px 0 #dcc193}

/* 對話框 */
#dialog{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);bottom:calc(var(--u)*4);display:flex;gap:calc(var(--u)*3);padding:calc(var(--u)*3);font-size:calc(var(--u)*5.2);min-height:calc(var(--u)*40);align-items:flex-start}
#dialog .por{width:calc(var(--u)*28);height:calc(var(--u)*34);flex:none;background:#2a1f33;border:calc(var(--u)*.8) solid var(--ink);display:flex;align-items:center;justify-content:center}
#dialog .por canvas{width:100%;height:auto;image-rendering:pixelated}
#dialog .dn{font-weight:900;color:#7a4e2d;margin-bottom:calc(var(--u)*1)}
#dialog .dt{font-weight:800;line-height:1.55;white-space:pre-wrap}
#dialog .dmore{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*2);animation:blink .8s infinite;font-weight:900}
#dialog .dch{display:flex;flex-wrap:wrap;gap:calc(var(--u)*2);margin-top:calc(var(--u)*2)}
#dialog .dch button{font-size:calc(var(--u)*4.4)}
@keyframes blink{50%{opacity:0}}

/* 全畫面層 */
#screen,#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:auto}
#screen:empty,#ov:empty{display:none}
#screen{background:radial-gradient(circle at 50% 20%,#4a2a6b,#1a1220 70%)}
#ov{background:rgba(13,9,18,.82);z-index:30}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(13,9,18,.6);padding:12px}
#modal:empty{display:none}
#modal .px{max-width:min(760px,96vw);max-height:92vh;overflow:auto;padding:20px 24px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;background:#2a1f33;color:#ffe3a3;border:4px solid #0d0912;padding:8px 18px;font-weight:900;font-size:18px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* 標題與登入 */
.title{width:min(760px,96vw);text-align:center;padding:26px 30px;color:#f4e4c1}
.logo{font-size:52px;font-weight:900;letter-spacing:4px;color:#ffe3a3;text-shadow:4px 4px 0 #c94c4c,8px 8px 0 #0d0912;margin:6px 0}
.sublogo{font-size:20px;font-weight:900;color:#d8c7a6;margin-bottom:16px}
.grades{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.grades .pbtn{min-width:96px}
.grades .pbtn.on{outline:4px solid #ffe3a3;outline-offset:2px}
.field{display:flex;align-items:center;gap:10px;margin:10px 0;text-align:left}
.field label{width:90px;font-weight:900;font-size:18px}
.field input{flex:1;font-size:20px;padding:8px 12px;border:4px solid var(--ink);background:#fff8e6;outline:none;font-weight:800}
.plist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.link{background:none;border:0;color:#7a4e2d;font-weight:900;text-decoration:underline;font-size:15px}
.title .link{color:#ffe3a3}
.looks{display:flex;gap:12px;justify-content:center;margin:12px 0}
.looks button{background:#2a1f33;border:4px solid #0d0912;padding:8px}
.looks button.on{border-color:#ffe3a3;box-shadow:0 0 0 3px #e8b04a}
.looks canvas{width:84px;height:108px;image-rendering:pixelated;display:block}

/* 戰鬥 */
.battle{width:min(1100px,98vw);height:min(720px,96vh);display:flex;flex-direction:column;gap:8px;padding:10px}
.bscene{flex:none;height:200px;position:relative;border:4px solid #0d0912;overflow:hidden;image-rendering:pixelated}
.bscene .bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.bunit{position:absolute;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bunit canvas{image-rendering:pixelated}
.bunit .nm{font-weight:900;color:#fff;text-shadow:2px 2px 0 #000;font-size:16px;white-space:nowrap}
.bunit .bar{width:150px;flex:none;height:14px;border:3px solid #0d0912}
.bhero{left:12%}
.bmon{right:12%}
.lunge{animation:lunge .35s}
@keyframes lunge{50%{transform:translateX(60px)}}
.lungeL{animation:lungeL .35s}
@keyframes lungeL{50%{transform:translateX(-60px)}}
.hurt{animation:hurt .4s}
@keyframes hurt{20%,60%{filter:brightness(3) saturate(0);transform:translateX(6px)}40%,80%{transform:translateX(-6px)}}
.dmg{position:absolute;font-size:30px;font-weight:900;color:#fff;text-shadow:3px 3px 0 #c94c4c,-2px -2px 0 #000;animation:dmg 1s forwards;pointer-events:none;z-index:5}
.dmg.heal{text-shadow:3px 3px 0 #2f8a2f,-2px -2px 0 #000}
@keyframes dmg{0%{transform:translateY(0) scale(.6)}20%{transform:translateY(-20px) scale(1.2)}100%{transform:translateY(-50px);opacity:0}}
.bmsg{flex:none;padding:8px 14px;font-weight:900;font-size:19px;min-height:48px;display:flex;align-items:center}
.bmid{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.bcmd{flex:none;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px}
.bcmd .pbtn{font-size:20px;min-width:140px}
.wkind{font-size:13px;font-weight:800;opacity:.85}

/* 小遊戲共用（沿用打字遊戲引擎） */
.qpanel{width:min(1240px,99vw);height:min(840px,98vh);display:flex;flex-direction:column;gap:6px;padding:10px}
.ghead{flex:none;display:flex;align-items:center;gap:12px;padding:6px 12px}
.ghead .gt{font-size:20px;font-weight:900;white-space:nowrap}
.ghead .gw{font-size:15px;font-weight:800;color:#7a4e2d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead .hud{margin-left:auto;font-size:20px;font-weight:900;white-space:nowrap}
.ghead .timer{font-size:22px;font-weight:900;color:#b47d26;min-width:64px;text-align:right}
.arena{flex:1;min-height:200px;position:relative;overflow:hidden;border:4px solid var(--ink);background:linear-gradient(180deg,#bfe6ff,#dff3d0 70%,#a7d47a)}
.arena.dark{background:linear-gradient(180deg,#2e2640,#3d3650)}
.arena.paper{background:#efe2c4}
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(26,18,32,.45);z-index:20;padding:16px}
.ibox{text-align:center;max-width:640px;padding:18px 26px}
.ibox .iicon{font-size:54px;line-height:1.1}
.ibox h2{margin:6px 0;font-size:26px;font-weight:900}
.ibox p{font-size:19px;font-weight:800;line-height:1.6;margin:8px 0 14px}
.ibox .small{font-size:13px;color:#7a4e2d;margin-top:8px;font-weight:800}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:130px;font-weight:900;color:#ffe3a3;text-shadow:6px 6px 0 #0d0912;z-index:21;pointer-events:none}
.count span{animation:zoomin .6s ease-out}
@keyframes zoomin{from{transform:scale(2);opacity:0}to{transform:scale(1);opacity:1}}
.tgt{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff8e6;border:4px solid var(--ink);box-shadow:inset -4px -4px 0 #dcc193;animation:appear .15s ease-out;z-index:2}
.tgt .te{line-height:1;pointer-events:none}
.tgt .tl{position:absolute;bottom:-26px;white-space:nowrap;font-size:14px;font-weight:900;background:var(--ink);color:#fff;padding:1px 6px;pointer-events:none}
.tgt.k-double{background:#ffe3a3}
.tgt.k-right{background:#e3d4ff}
.tgt .ring{position:absolute;inset:-9px;border:4px solid #e8b04a;animation:ring linear forwards;pointer-events:none}
@keyframes ring{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0);border-color:#c94c4c}}
@keyframes appear{from{transform:scale(.3)}to{transform:scale(1)}}
.pop{animation:popout .3s forwards!important;pointer-events:none}
@keyframes popout{to{transform:scale(1.6);opacity:0}}
.fade{animation:fadeout .3s forwards!important;pointer-events:none}
@keyframes fadeout{to{transform:translateY(20px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.boom{position:absolute;font-size:20px;font-weight:900;pointer-events:none;z-index:30;animation:float .8s forwards;text-shadow:2px 2px 0 #fff}
@keyframes float{to{transform:translateY(-40px);opacity:0}}
.dragzone{position:absolute;left:0;right:0;top:0;bottom:140px}
.bins{position:absolute;left:10px;right:10px;bottom:10px;height:122px;display:flex;gap:10px}
.bin{flex:1;background:rgba(244,228,193,.8);border:4px dashed var(--ink);display:flex;flex-direction:column;align-items:center;padding:4px}
.bin.over{background:#ffe3a3;border-style:solid}
.bin .bt{font-size:21px;font-weight:900}
.bin .bslot{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:3px}
.bin .bslot span{font-size:13px;font-weight:800;background:#b8ef90;padding:1px 5px;border:2px solid var(--ink)}
.chip{position:absolute;padding:8px 14px;background:#fff8e6;font-size:22px;font-weight:900;cursor:grab;touch-action:none;border:4px solid var(--ink);box-shadow:inset -4px -4px 0 #dcc193,0 4px 0 rgba(0,0,0,.3);white-space:nowrap;z-index:3}
.chip.dragging{cursor:grabbing;transform:scale(1.1) rotate(-3deg);z-index:10}
.chip.back{transition:left .3s,top .3s}
.scroller{position:absolute;inset:0;overflow-y:scroll}
.scontent{position:relative;width:100%}
.deco{position:absolute;font-size:42px;pointer-events:none;opacity:.9}
.find{position:absolute;font-size:44px;cursor:pointer;animation:wiggle 1.2s infinite;z-index:2}
@keyframes wiggle{50%{transform:rotate(12deg) scale(1.08)}}
.scrollhint{position:absolute;right:14px;top:10px;background:var(--ink);color:#fff;font-weight:900;padding:5px 10px;z-index:5;pointer-events:none}
.drop{position:absolute;top:0;min-width:62px;height:62px;padding:0 10px;background:#fff8e6;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;border:4px solid var(--ink);box-shadow:inset -4px -4px 0 #dcc193;will-change:transform}
.drop.small{font-size:20px}
.drop.target{background:#ffe3a3;outline:4px solid #e8b04a}
.drop.splat{background:#2b1d14;color:#fff;transition:.3s;opacity:0}
.ground{position:absolute;left:0;right:0;bottom:0;height:44px;background:repeating-linear-gradient(90deg,#7a4e2d 0 16px,#5a3a22 16px 32px);border-top:4px solid var(--ink)}
.ground.bad{background:#c94c4c}
.kbd{flex:none;padding:6px 8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.krow{display:flex;gap:4px}
.key{width:44px;height:42px;background:var(--fc);border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:16px;position:relative;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.key small{font-size:12px;color:#7c2d12;line-height:1}
.key.space{width:290px}
.key.shift{width:80px;font-size:13px}
.key.hl{transform:translateY(-3px) scale(1.08);z-index:2;background:#ffe3a3;animation:hlb .7s infinite;outline:3px solid #c94c4c}
@keyframes hlb{50%{background:#fff}}
.key.badk{background:#ffb3a8!important}
.key.home::after{content:"";position:absolute;bottom:4px;width:12px;height:3px;background:var(--ink)}
.khint{font-size:16px;font-weight:900;min-height:22px}
.khint .fdot{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin:0 4px;border:2px solid var(--ink)}
.result{width:min(640px,96vw);padding:22px 26px;text-align:center}
.bigstars{font-size:60px;letter-spacing:6px;margin:4px 0}
.bigstars .s{display:inline-block;color:#c8b896}
.bigstars .s.on{color:#e8b04a;text-shadow:3px 3px 0 #7a4e2d;animation:starpop .5s both}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.wlist{text-align:left;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:center;gap:10px;font-weight:800}
.wrow .wn{width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .wb{flex:1;height:14px;background:#dcc193;border:2px solid var(--ink)}
.wrow .wb i{display:block;height:100%;background:#7cc456}
.wrow .wv{width:46px;text-align:right}
.rbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}

/* 施法、盾 */
.cast{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.runes{display:flex;gap:12px}
.rune{width:76px;height:84px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;background:#2a1f33;color:#c9b6ff;border:4px solid #0d0912;box-shadow:inset 0 0 0 3px #5b3f8a}
.rune.cur{color:#fff;background:#5b3f8a;box-shadow:0 0 0 4px #e8b04a;transform:translateY(-4px)}
.rune.ok{background:#7cc456;color:#fff;box-shadow:none}
.rune.small{font-size:20px}
.shield{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.shield .sk{font-size:56px;font-weight:900;background:#fff8e6;border:5px solid var(--ink);padding:8px 26px;box-shadow:inset -5px -5px 0 #dcc193}
.shield .sbar{width:320px;height:16px;border:3px solid var(--ink);background:#dcc193}
.shield .sbar i{display:block;height:100%;background:#e0675a}

/* 鍵盤導覽 */
.ktour{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px}
.ktask{font-size:24px;font-weight:900;background:#fff8e6;border:4px solid var(--ink);padding:8px 18px;text-align:center}
.ktask small{display:block;font-size:15px;color:#7a4e2d}
.fullkb{display:flex;flex-direction:column;gap:5px;background:#43364f;padding:10px;border:4px solid #0d0912}
.fullkb .krow{gap:5px}
.fk{height:46px;background:#f4e4c1;border:3px solid #0d0912;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;cursor:pointer;box-shadow:inset -3px -3px 0 #dcc193;white-space:nowrap;padding:0 4px}
.fk:hover{background:#fff8e6}
.fk.hl{background:#ffe3a3;outline:3px solid #c94c4c;animation:hlb .7s infinite}
.fk.ok{background:#b8ef90}
.fk.bad{background:#ffb3a8}
.fk.home{position:relative}
.fk.home::after{content:"";position:absolute;bottom:4px;width:12px;height:3px;background:var(--ink)}

/* 魔法畫室 */
.paint{position:absolute;inset:0;display:flex;gap:8px;padding:8px}
.ptools{flex:none;display:flex;flex-direction:column;gap:6px;width:112px}
.ptools button{font-size:15px;font-weight:900;background:#f4e4c1;border:3px solid var(--ink);padding:6px 4px;box-shadow:inset -3px -3px 0 #dcc193;display:flex;flex-direction:column;align-items:center}
.ptools button .ti{font-size:24px}
.ptools button.on{background:#ffe3a3;outline:3px solid #c94c4c}
.ptools button:disabled{opacity:.35;cursor:not-allowed}
.pmain{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pwin{border:4px solid var(--ink);background:#fff;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
.pwin .ptitle{background:#3a6fb0;color:#fff;font-weight:900;font-size:13px;padding:2px 8px}
.pwin canvas{display:block;image-rendering:pixelated;cursor:crosshair;touch-action:none}
.ppal{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.ppal button{width:44px;height:38px;border:3px solid var(--ink);font-weight:900;font-size:17px;color:#2b1d14;text-shadow:0 0 3px #fff}
.ppal button.on{outline:4px solid #c94c4c;transform:translateY(-3px)}
.pmsg{font-size:18px;font-weight:900;background:#fff8e6;border:3px solid var(--ink);padding:5px 14px;text-align:center;max-width:100%}
.pmsg.warn{background:#ffd6cf}
.pmsg.good{background:#d4f5bd}
.splash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#fff;text-shadow:4px 4px 0 #3b1f5c;pointer-events:none;z-index:9;animation:float 1.6s forwards}

/* 選單內容 */
.mtitle{font-size:24px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}

.code{font-family:Consolas,"Courier New",monospace;font-size:40px;font-weight:900;letter-spacing:4px;background:#ffe3a3;border:4px dashed var(--ink);padding:8px 16px;display:inline-block;margin:8px 0}

/* 地圖上的文字標籤 */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wlabel{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-weight:900;font-size:calc(var(--u)*3.8);pointer-events:none}
.wlabel.sign{background:#e8d3a3;color:#5a3a22;border:calc(var(--u)*.6) solid #5a3a22;padding:0 calc(var(--u)*1.5)}
.wlabel.name{background:rgba(26,18,32,.85);color:#fff;padding:calc(var(--u)*.4) calc(var(--u)*1.6);border:calc(var(--u)*.5) solid #0d0912}
.wlabel.name b{color:#ffe3a3;margin-left:calc(var(--u)*1.5)}
.wlabel.mark{font-size:calc(var(--u)*7);color:#ffd23f;text-shadow:2px 2px 0 #0d0912;animation:bounce .8s infinite}
.wlabel.boss{color:#ff8a8a;text-shadow:2px 2px 0 #0d0912;font-size:calc(var(--u)*4.4)}
.wlabel.exit{color:#fff;background:rgba(26,18,32,.7);padding:0 calc(var(--u)*1.5);font-size:calc(var(--u)*3.6)}
@keyframes bounce{50%{transform:translate(-50%,-120%)}}

/* 戰鬥畫面在小螢幕也放得下鍵盤 */

/* ===== 三四年級小遊戲 ===== */

.ztarget{font-size:50px;font-weight:900;background:#fff8e6;border:5px solid var(--ink);padding:12px 26px;letter-spacing:4px;text-align:center}
.ztarget span{color:#a89a80}.ztarget span.ok{color:#2f8a2f}.ztarget span.bad{color:#c94c4c;text-decoration:underline wavy}.ztarget span.cur{color:var(--ink);box-shadow:inset 0 -6px 0 #e8b04a}

.mhero{position:absolute;left:12px;bottom:30%;font-size:60px;z-index:3}

/* 排序、選取、快捷鍵、對齊、評審、播放 */
.ordwrap,.msel,.sc,.alw,.jw,.pres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.otask{font-size:18px;font-weight:900;background:#fff8e6;border:4px solid var(--ink);padding:6px 14px;text-align:center}

.ocard{background:#fff;border:4px solid var(--ink);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;text-align:center;padding:8px;cursor:grab;position:relative;touch-action:none;box-shadow:inset -4px -4px 0 #ddd}

.mslide,.scslide,.aslide{position:relative;flex:1;width:min(860px,100%);background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.2);overflow:hidden;touch-action:none}

.mzone{position:absolute;right:2%;top:4%;width:42%;height:92%;border:4px dashed #e8b04a;display:flex;align-items:center;justify-content:center;font-weight:900;color:#b47d26;pointer-events:none}
.sckey{font-size:40px;font-weight:900;background:#2a1f33;color:#ffe3a3;border:4px solid #0d0912;padding:4px 22px;font-family:Consolas,monospace}

.scat{font-size:72px;cursor:pointer;border:4px solid transparent;padding:4px}

.sdeco{position:absolute;left:16px;top:12px;font-size:30px}.sdeco.d2{left:auto;right:16px}
.aslot{position:absolute;border:3px dashed #e0457b;color:transparent;pointer-events:none}

.atitle{font-size:30px;font-weight:900;padding:4px 16px}
.apic{font-size:80px;line-height:1;padding:6px 20px}

.aline{font-size:22px;font-weight:800;padding:4px 10px;width:180px}
.guide{position:absolute;background:#e0457b;z-index:3;pointer-events:none}

.jpair{display:flex;gap:18px;flex:1;width:100%;justify-content:center;align-items:stretch}

.jcard.good{border-color:#2f8a2f;box-shadow:0 0 0 5px #7cc456}.jcard.badc{border-color:#c94c4c;box-shadow:0 0 0 5px #e0675a}
.jl{position:absolute;left:8px;top:4px;font-size:22px;font-weight:900;color:#888}
.js{aspect-ratio:16/9;width:100%;border:1px solid #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;overflow:hidden;background:#fff}

.jwhy:empty{display:none}
.prkey{font-size:36px;font-weight:900;background:#2a1f33;color:#ffe3a3;border:4px solid #0d0912;padding:2px 20px;font-family:Consolas,monospace}
.prview{flex:1;width:min(760px,100%);background:#ddd;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;position:relative;padding:16px}
.prview.play{background:#000}
.prslide{background:#fff;aspect-ratio:16/9;width:90%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.prslide h3{font-size:34px;margin:0 0 8px}
.prpage{position:absolute;right:10px;bottom:6px;color:#888;font-weight:900}
.onote:empty{visibility:hidden}
.bar.en{height:10px}
.bar.en i{background:#5aa7e0}
.bar.en span{font-size:9px}
.traits{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.traits span{font-size:12px;font-weight:900;background:#2a1f33;color:#ffe3a3;border:2px solid #0d0912;padding:0 5px}
.elite{filter:sepia(1) saturate(5) hue-rotate(-10deg) brightness(1.15) drop-shadow(0 0 6px #ffd23f)}
.fog{position:absolute;inset:0;z-index:15;background:radial-gradient(circle,#c9c3d6 0%,#8f88a3 70%);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff;text-shadow:3px 3px 0 #3b2a5a;pointer-events:none;transition:opacity .4s}
.fog.clear{opacity:0}
.bigshake{animation:bigshake .45s}
@keyframes bigshake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-2px)}80%{transform:translate(5px,3px)}}
.askbox{position:fixed;inset:0;z-index:300;background:rgba(13,9,18,.6);display:flex;align-items:center;justify-content:center;padding:12px}
.askbox .px{width:min(420px,94vw);padding:18px 22px;text-align:center}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* ===== 影片剪輯室 ===== */

.vtrack{position:relative;height:52px;margin-top:4px}

<body>
<div id="root" style="visibility:hidden">
  <div id="stage">
    <canvas id="cv" width="384" height="208"></canvas>
    <div id="labels"></div>
    <div id="whud" class="hidden">
      <div class="box stat">
        <div class="row"><span id="hName"></span><span id="hLv" style="color:#ffe3a3"></span><span id="hGold" style="margin-left:auto"></span></div>
        <div class="row">HP<div class="bar" id="hHp"></div></div>
        <div class="row">EXP<div class="bar exp" id="hExp"></div></div>
        <div class="row" id="hArea" style="font-size:calc(var(--u)*3.6);color:#d8c7a6"></div>
      </div>
      <div>
        <div class="box quest"><div class="qt" id="hQt"></div><div class="qg" id="hQg"></div></div>
        <div class="btns"><button onclick="openBag()">🎒 背包</button><button onclick="openQuests()">📜 任務</button><button onclick="openDex()">📖 圖鑑</button><button onclick="openCode()">🔑 密碼</button><button onclick="openSettings()">⚙️</button></div>
      </div>
    </div>

    <div id="fade"></div>
  </div>
  <div id="hint" class="hidden"><b>← →</b> 走路　<b>空白鍵</b> 跳　<b>↑</b> 說話／進門　<b>B</b> 背包　<b>Q</b> 任務　也可以用滑鼠點地面走路</div>
</div>
<div id="screen"></div>
<div id="ov"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
// =====================================================================
//  鍵盤勇者 RPG — 核心工具
//  老師專區密碼（可自行修改）
const TEACHER_PIN = '1234';
// =====================================================================
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const clamp01 = x => clamp(x, 0, 1);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 遊戲內建的確認／輸入視窗（取代瀏覽器的 prompt、confirm，避免被擋掉沒反應）
function askBox({ title = '', text = '', input = false, password = false, ok = '確定', cancel = '取消' } = {}) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'askbox';
    el.innerHTML = `<div class="px"><h3 style="margin:0 0 8px">${title}</h3><div style="font-weight:800;line-height:1.6">${text}</div>
      ${input ? `<input id="askIn" type="${password ? 'password' : 'text'}" style="width:100%;font-size:22px;margin-top:10px;padding:6px 10px;border:4px solid #2b1d14;font-weight:900" autocomplete="off">` : ''}
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">${cancel ? `<button class="pbtn gray" id="askNo">${cancel}</button>` : ''}<button class="pbtn green" id="askYes">${ok}</button></div></div>`;
    document.body.appendChild(el);
    const done = v => { el.remove(); document.removeEventListener('keydown', kd, true); res(v); };
    const kd = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); e.stopPropagation(); done(input ? el.querySelector('#askIn').value : true); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(input ? null : false); } };
    document.addEventListener('keydown', kd, true);
    el.querySelector('#askYes').onclick = () => done(input ? el.querySelector('#askIn').value : true);
    if (cancel) el.querySelector('#askNo').onclick = () => done(input ? null : false);
    setTimeout(() => { const i = el.querySelector('#askIn'); if (i) i.focus(); }, 30);
  });
}
function toast(t, ms = 2200) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms); }

// ===== 音效（8-bit 風）=====
let AC = null, muted = false;
try { muted = localStorage.getItem('kr_muted') === '1'; } catch (e) {}
function beep(f, d = .08, type = 'square', v = .05, when = 0, slide = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const SFX = {
  hit() { beep(880, .06, 'square', .04); beep(1320, .07, 'square', .035, .04); },
  miss() { beep(200, .16, 'sawtooth', .04, 0, -120); },
  wrong() { beep(150, .1, 'square', .035); },
  win() { [523, 659, 784, 1047].forEach((f, i) => beep(f, .16, 'square', .045, i * .1)); },
  star() { beep(1568, .12, 'triangle', .07); },
  go() { beep(660, .05, 'square', .04); },
  jump() { beep(330, .12, 'square', .03, 0, 300); },
  coin() { beep(988, .05, 'square', .04); beep(1319, .12, 'square', .04, .05); },
  door() { beep(200, .08, 'triangle', .06); beep(150, .1, 'triangle', .06, .07); },
  talk() { beep(520 + Math.random() * 80, .03, 'square', .02); },
  swing() { beep(600, .1, 'sawtooth', .03, 0, -400); },
  hurt() { beep(120, .2, 'sawtooth', .05, 0, -60); },
  heal() { [660, 880, 1100].forEach((f, i) => beep(f, .1, 'triangle', .05, i * .07)); },
  level() { [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, .12, 'square', .045, i * .08)); },
  boss() { [196, 185, 175, 165].forEach((f, i) => beep(f, .25, 'sawtooth', .04, i * .2)); }
};
function toggleMute() { muted = !muted; try { localStorage.setItem('kr_muted', muted ? '1' : '0'); } catch (e) {} return muted; }

// ===== 儲存 =====
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let profiles = LS.get('kr_profiles', {});
let me = null;
function saveMe() { if (!me) return; profiles[me.id] = me; LS.set('kr_profiles', profiles); }

// ===== 學期判斷：8～1 月上學期、2～7 月下學期 =====
function autoSem() { const m = new Date().getMonth() + 1; return (m >= 8 || m === 1) ? 0 : 1; }
const SEM_NAME = ['上', '下'];

// ===== 武器、道具 =====
const WEAPON_ORDER = ['wsword', 'csword', 'isword', 'hbow', 'lbow', 'wstaff', 'sstaff', 'mbook', 'gbook', 'legend'];
const WEAPONS = {
  wsword: { n: '木劍', kind: 'sword', atk: 3, price: 0 },
  csword: { n: '銅劍', kind: 'sword', atk: 5, price: 60 },
  isword: { n: '鐵劍', kind: 'sword', atk: 8, price: 160 },
  hbow: { n: '獵弓', kind: 'bow', atk: 4, price: 50 },
  lbow: { n: '長弓', kind: 'bow', atk: 7, price: 150 },
  wstaff: { n: '木杖', kind: 'staff', atk: 4, price: 0 },
  sstaff: { n: '星光杖', kind: 'staff', atk: 7, price: 150 },
  mbook: { n: '魔法書', kind: 'book', atk: 6, price: 80 },
  gbook: { n: '黃金魔法書', kind: 'book', atk: 9, price: 180 },
  legend: { n: '傳說之劍', kind: 'sword', atk: 13, price: 0 }
};
const KIND = {
  sword: { n: '劍', icon: '🗡️', how: '滑鼠點擊攻擊', good: '史萊姆、蘑菇怪' },
  bow: { n: '弓', icon: '🏹', how: '滑鼠瞄準移動的靶', good: '會飛的怪物' },
  staff: { n: '法杖', icon: '🪄', how: '鍵盤按出咒語', good: '墨影系、注音系怪物' },
  book: { n: '魔法書', icon: '📖', how: '打出英文單字', good: '字母系、機器怪物' }
};
const ITEMS = {
  potion: { n: '補血藥水', icon: '🧪', price: 15, desc: '回復 25 HP' },
  meal: { n: '勇者便當', icon: '🍱', price: 40, desc: '回復全部 HP' },
  hourglass: { n: '時光沙漏', icon: '⏳', price: 30, desc: '這場戰鬥的挑戰時間變長' },
  bomb: { n: '雷電卷軸', icon: '⚡', price: 40, desc: '直接造成 15 點傷害' }
};
const maxHp = p => 30 + (p.lv - 1) * 6;
const expNeed = p => 15 * p.lv;

function newProfile(grade, sem, cls, seat, name, look) {
  return { id: `${grade}${SEM_NAME[sem]}-${cls}-${seat}`, grade, sem, cls, seat: Number(seat) || 0, name: name || '勇者', look: look || 0,
    lv: 1, exp: 0, gold: 20, hp: 30, weapons: ['wsword'], eq: 'wsword', items: { potion: 2 }, quest: 0, qn: 0,
    area: null, x: null, stars: {}, best: { mouse: 0, key: 0, zh: 0, en: 0 }, flags: {}, kills: 0 };
}

// ===== 通關密碼（15 碼，電腦裝還原卡也不怕）=====
const B32 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const CODE_FIELDS = [['g', 2], ['s', 1], ['seat', 6], ['lv', 5], ['gold', 8], ['q', 5], ['wm', 10], ['eq', 4], ['bk', 7], ['bm', 7], ['bz', 7], ['be', 6]];
function codeCheck(o) { let c = 0; CODE_FIELDS.forEach(([k], i) => c += (o[k] || 0) * (i * 3 + 7)); return c % 64; }
function makeCode(p) {
  const o = { g: clamp(p.grade - 3, 0, 3), s: p.sem, seat: clamp(p.seat, 0, 63), lv: clamp(p.lv, 1, 31), gold: clamp(Math.floor(p.gold / 5), 0, 255),
    q: clamp(p.quest, 0, 31), wm: WEAPON_ORDER.reduce((m, w, i) => m | (p.weapons.includes(w) ? 1 << i : 0), 0),
    eq: Math.max(0, WEAPON_ORDER.indexOf(p.eq)), bk: clamp(Math.round(p.best.key || 0), 0, 127), bm: clamp(Math.round(p.best.mouse || 0), 0, 127), bz: clamp(Math.round(p.best.zh || 0), 0, 127), be: clamp(Math.round(p.best.en || 0), 0, 63) };
  let v = 0n;
  CODE_FIELDS.forEach(([k, b]) => { v = (v << BigInt(b)) | BigInt(o[k] & ((1 << b) - 1)); });
  v = (v << 6n) | BigInt(codeCheck(o));
  let out = '';
  for (let i = 0; i < 15; i++) { out = B32[Number(v & 31n)] + out; v >>= 5n; }
  return out.slice(0, 5) + '-' + out.slice(5, 10) + '-' + out.slice(10);
}
function readCode(str) {
  const s = String(str).toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (s.length !== 15) return null;
  let v = 0n;
  for (const ch of s) { const i = B32.indexOf(ch); if (i < 0) return null; v = (v << 5n) | BigInt(i); }
  const ck = Number(v & 63n); v >>= 6n;
  const o = {};
  [...CODE_FIELDS].reverse().forEach(([k, b]) => { o[k] = Number(v & ((1n << BigInt(b)) - 1n)); v >>= BigInt(b); });
  if (v !== 0n || codeCheck(o) !== ck) return null;
  return { grade: o.g + 3, sem: o.s, seat: o.seat, lv: Math.max(1, o.lv), gold: o.gold * 5, quest: o.q,
    weapons: WEAPON_ORDER.filter((w, i) => o.wm & (1 << i)), eq: WEAPON_ORDER[o.eq] || 'wsword', best: { key: o.bk, mouse: o.bm, zh: o.bz, en: o.be } };
}

// ===== 鍵盤資料 =====
const KB_ROWS = [
  ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0', 'Minus'],
  ['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP'],
  ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon'],
  ['ShiftLeft', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Comma', 'Period', 'Slash', 'ShiftRight'],
  ['Space']
];
const ZY = { Digit1: 'ㄅ', KeyQ: 'ㄆ', KeyA: 'ㄇ', KeyZ: 'ㄈ', Digit2: 'ㄉ', KeyW: 'ㄊ', KeyS: 'ㄋ', KeyX: 'ㄌ', KeyE: 'ㄍ', KeyD: 'ㄎ', KeyC: 'ㄏ',

// =====================================================================
//  橫向捲軸世界：走路、跳、地圖、NPC、怪物
// =====================================================================
const TILE = 16, VW = 384, VH = 208, ROWS = 13;
const cv = $('cv'), cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;
const KEYS = {};
const world = { active: false, visible: false, id: null, A: null, tiles: null, w: 0, ents: [], deco: [], cam: 0, t: 0, target: null, targetEnt: null, near: null, exitCd: 0, scale: 3 };
const hero = { x: 40, y: 100, vx: 0, vy: 0, w: 10, h: 16, face: 1, onGround: false, anim: 0 };

function fitStage() {
  const W = innerWidth - 16, H = innerHeight - 44;
  let s = Math.min(W / VW, H / VH);
  s = s >= 2 ? Math.floor(s * 2) / 2 : Math.max(1, s);
  world.scale = s;
  const st = $('stage'); st.style.width = VW * s + 'px'; st.style.height = VH * s + 'px';
  st.style.setProperty('--u', (s * 1) + 'px');
}
addEventListener('resize', fitStage);

function buildTiles(A) {
  const g = A.ground || 11, t = Array.from({ length: ROWS }, () => new Uint8Array(A.w));
  const hill = new Int8Array(A.w);
  (A.hills || []).forEach(([x0, x1, h]) => { for (let x = x0; x <= x1 && x < A.w; x++) hill[x] = Math.max(hill[x], h); });
  for (let x = 0; x < A.w; x++) for (let r = g - hill[x]; r < ROWS; r++) t[r][x] = 1;
  (A.plats || []).forEach(([x, r, len]) => { for (let i = 0; i < len; i++) if (t[r] && x + i < A.w && !t[r][x + i]) t[r][x + i] = 2; });
  return t;
}
const solidAt = (c, r) => r >= ROWS || (r >= 0 && c >= 0 && c < world.w && world.tiles[r][c] === 1);
const platAt = (c, r) => r >= 0 && r < ROWS && c >= 0 && c < world.w && world.tiles[r][c] === 2;
function groundY(px) { const c = clamp(Math.floor(px / TILE), 0, world.w - 1); for (let r = 0; r < ROWS; r++) if (world.tiles[r][c] === 1) return r * TILE; return ROWS * TILE; }

function enterArea(id, x, face) {
  const A = AREAS[id];
  world.id = id; world.A = A; world.w = A.w; world.tiles = buildTiles(A);
  world.ents = A.ents().map(e => Object.assign({ dir: Math.random() < .5 ? -1 : 1, ph: Math.random() * 6 }, e));
  world.ents.filter(e => e.t === 'mon').forEach(m => { m.x0 = m.x0 ?? m.x - 40; m.x1 = m.x1 ?? m.x + 40; m.spd = m.spd ?? (MONS[m.kind].fly ? 26 : 18); });
  world.deco = (A.deco || []).map(d => Object.assign({}, d));
  hero.x = x ?? A.start ?? 40; hero.y = groundY(hero.x + 5) - hero.h; hero.vx = hero.vy = 0; hero.face = face || 1;
  world.target = null; world.targetEnt = null; world.exitCd = .6;
  me.area = id; me.x = hero.x; saveMe();
  clearLabels();
  updateHUD();
  if (A.onEnter) A.onEnter();
}
async function fadeTo(fn) { $('fade').classList.add('on'); await sleep(260); await fn(); await sleep(60); $('fade').classList.remove('on'); }

function worldKeyDown(e) {
  if (!world.active) return;
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  if (e.repeat) return;
  if (c === 'Space') jump();
  else if (c === 'ArrowUp' || c === 'KeyW') { if (world.near) interact(world.near); else jump(); }
  else if (c === 'KeyE' || c === 'Enter') { if (world.near) interact(world.near); }
  else if (c === 'KeyB' || c === 'KeyI') openBag();
  else if (c === 'KeyQ') openQuests();
  else if (c === 'KeyM') openDex();
  else if (c === 'Escape') openSettings();
}
function jump() { if (hero.onGround) { hero.vy = -322; hero.onGround = false; SFX.jump(); if (me) { me.stat = me.stat || {}; me.stat.jumps = (me.stat.jumps || 0) + 1; if (me.stat.jumps % 50 === 0) { saveMe(); checkAch(); } } } }

function interact(ent) {
  if (!world.active || !ent) return;
  world.target = null; world.targetEnt = null;
  KEYS.ArrowLeft = KEYS.ArrowRight = KEYS.KeyA = KEYS.KeyD = false;
  if (ent.use) ent.use(ent);
}

function updateWorld(dt) {
  world.t += dt;
  if (world.exitCd > 0) world.exitCd -= dt;
  let dir = (KEYS.ArrowRight || KEYS.KeyD ? 1 : 0) - (KEYS.ArrowLeft || KEYS.KeyA ? 1 : 0);
  if (dir) { world.target = null; world.targetEnt = null; }
  else if (world.target != null) {
    const dx = world.target - (hero.x + hero.w / 2);
    if (Math.abs(dx) < 4) { const te = world.targetEnt; world.target = null; world.targetEnt = null; if (te && te.use) interact(te); }
    else dir = Math.sign(dx);
  }
  hero.vx = dir * 92; if (dir) hero.face = dir;
  hero.vy = Math.min(hero.vy + 720 * dt, 420);
  // 水平
  hero.x += hero.vx * dt;
  const r0 = Math.floor(hero.y / TILE), r1 = Math.floor((hero.y + hero.h - .01) / TILE);
  if (hero.vx > 0) { const c = Math.floor((hero.x + hero.w) / TILE); for (let r = r0; r <= r1; r++) if (solidAt(c, r)) { hero.x = c * TILE - hero.w - .01; break; } }
  else if (hero.vx < 0) { const c = Math.floor(hero.x / TILE); for (let r = r0; r <= r1; r++) if (solidAt(c, r)) { hero.x = (c + 1) * TILE + .01; break; } }
  // 垂直
  const prevBottom = hero.y + hero.h;
  hero.y += hero.vy * dt;
  const c0 = Math.floor(hero.x / TILE), c1 = Math.floor((hero.x + hero.w - .01) / TILE);
  hero.onGround = false;
  if (hero.vy >= 0) {
    const r = Math.floor((hero.y + hero.h) / TILE);
    for (let c = c0; c <= c1; c++) if (solidAt(c, r) || (platAt(c, r) && prevBottom <= r * TILE + .5)) { hero.y = r * TILE - hero.h; hero.vy = 0; hero.onGround = true; break; }
  } else {
    const r = Math.floor(hero.y / TILE);
    for (let c = c0; c <= c1; c++) if (solidAt(c, r)) { hero.y = (r + 1) * TILE; hero.vy = 0; break; }
  }
  // 邊界與出口
  const maxX = world.w * TILE - hero.w;
  if (hero.x < 0) hero.x = 0; if (hero.x > maxX) hero.x = maxX;
  if (world.exitCd <= 0) {
    if (hero.x <= 0 && dir < 0) tryExit('left');
    else if (hero.x >= maxX && dir > 0) tryExit('right');
  }
  hero.anim += dt * (dir ? 9 : 0);
  // 怪物
  for (const m of world.ents) {
    if (m.t !== 'mon' || m.dead) continue;
    const M = MONS[m.kind];
    if (m.stun > 0) m.stun -= dt;
    if (!m.boss) { m.x += m.dir * m.spd * dt; if (m.x < m.x0) { m.x = m.x0; m.dir = 1; } if (m.x > m.x1) { m.x = m.x1; m.dir = -1; } }
    const spr = monSprite(m.kind, 0);
    const gy = groundY(m.x + spr.width / 2);
    m.y = M.fly ? gy - spr.height - 26 + Math.sin(world.t * 2.4 + m.ph) * 9 : gy - spr.height;
    if (!(m.stun > 0) && !world.busy) {
      const hx = hero.x, hy = hero.y;
      if (hx + hero.w > m.x + 2 && hx < m.x + spr.width - 2 && hy + hero.h > m.y + 2 && hy < m.y + spr.height - 2) {
        world.active = false; world.target = null; KEYS.ArrowLeft = KEYS.ArrowRight = KEYS.KeyA = KEYS.KeyD = false;
        startBattle(m);
        break;
      }
    }
  }
  // 互動目標
  let near = null, best = 99;
  for (const e of world.ents) {
    if (!e.use || e.t === 'mon') continue;
    const ex = e.t === 'door' ? e.x + (e.w || 16) / 2 : e.x + 7;
    const d = Math.abs(ex - (hero.x + hero.w / 2));
    const reach = e.t === 'door' ? (e.w || 16) / 2 + 4 : 16;
    if (e.y != null && Math.abs(hero.y + hero.h - (e.y + 14)) > 18) continue;
    if (e.opened) continue;
    if (d < reach && d < best) { best = d; near = e; }
  }
  world.near = near;
  world.cam = clamp(hero.x + hero.w / 2 - VW / 2, 0, Math.max(0, world.w * TILE - VW));
  me.x = hero.x;
}
async function tryExit(side) {
  const ex = world.ents.find(e => e.t === 'exit' && e.side === side);
  if (!ex) return;
  world.exitCd = 1;
  const msg = ex.lock && ex.lock();
  if (msg) { hero.x += side === 'left' ? 12 : -12; world.target = null; toast(msg, 3000); return; }
  world.active = false;
  SFX.door();
  await fadeTo(() => enterArea(ex.to, ex.toX ?? (side === 'right' ? 24 : AREAS[ex.to].w * TILE - 40), side === 'right' ? 1 : -1));
  world.active = true;
}

// ===== 繪製 =====
const LABELS = {};
let labelUsed = new Set();
function clearLabels() { Object.values(LABELS).forEach(el => el.remove()); for (const k in LABELS) delete LABELS[k]; }
function label(key, text, wx, wy, cls = '') {
  let el = LABELS[key];
  if (!el) { el = document.createElement('div'); el.className = 'wlabel ' + cls; $('labels').appendChild(el); LABELS[key] = el; }
  if (el._t !== text) { el.innerHTML = text; el._t = text; }
  const s = world.scale;
  el.style.left = Math.round((wx - world.cam) * s) + 'px'; el.style.top = Math.round(wy * s) + 'px';
  labelUsed.add(key);
}
function drawWorld() {
  if (!world.A) return;
  const A = world.A, th = A.theme, cam = Math.round(world.cam);
  const bg = bgLayers(th);
  cx.drawImage(bg.sky, 0, 0);
  const off = (img, f) => { const o = -Math.round(cam * f) % img.width; cx.drawImage(img, o, 0); cx.drawImage(img, o + img.width, 0); };
  off(bg.far, .2); off(bg.near, .45);
  labelUsed = new Set();
  // 背景裝飾
  for (const d of world.deco) {
    const img = decoImg(d); if (!img) continue;
    if (d.x + img.width < cam - 40 || d.x > cam + VW + 40) continue;
    const gy = groundY(d.x + img.width / 2);
    const n = d.n || 1;
    for (let i = 0; i < n; i++) cx.drawImage(img, Math.round(d.x - cam + i * (img.width - 1)), gy - img.height + (d.dy || 0));
    if (d.label) label('d' + d.x, typeof d.label === 'function' ? d.label() : d.label, d.x + img.width / 2, gy - img.height - 2 + (d.labelDy || 0), 'sign');
  }
  // 地塊
  const c0 = Math.max(0, Math.floor(cam / TILE)), c1 = Math.min(world.w - 1, Math.floor((cam + VW) / TILE));
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const t = world.tiles[r][c]; if (!t) continue;
    const img = t === 2 ? tileCanvas(th, 'plat') : (r > 0 && world.tiles[r - 1][c] === 1 ? tileCanvas(th, 'fill') : tileCanvas(th, 'top'));
    cx.drawImage(img, c * TILE - cam, r * TILE);
  }
  // 實體
  for (const e of world.ents) {
    if (e.t === 'npc') {
      const img = npcSprite(e.id), gy = groundY(e.x + 7);
      const face = hero.x < e.x ? -1 : 1;
      const bob = Math.round(Math.sin(world.t * 2 + e.x) * .6);
      cx.drawImage(face < 0 ? flipC(img) : img, Math.round(e.x - cam), gy - img.height + bob);
      const q = questMark(e);
      if (q) label('q' + e.id, q, e.x + 7, gy - img.height - 14, 'mark');
      if (world.near === e) label('n' + e.id, `${NPC_DEF[e.id].n}<b>▲ 說話</b>`, e.x + 7, gy - img.height - (q ? 26 : 14), 'name');
    } else if (e.t === 'mon' && !e.dead) {
      const fr = Math.floor(world.t * (MONS[e.kind].fly ? 8 : 3) + e.ph) % 2;
      let img = monSprite(e.kind, fr);
      if (e.dir > 0 && !e.boss) img = flipC(img);
      if (e.stun > 0 && Math.floor(world.t * 10) % 2) continue;
      cx.drawImage(img, Math.round(e.x - cam), Math.round(e.y));
      if (e.boss) label('b' + e.kind, `👑 ${MONS[e.kind].n}`, e.x + img.width / 2, e.y - 14, 'boss');
    } else if ((e.t === 'stone' || e.t === 'sign' || e.t === 'chest' || e.t === 'board' || e.t === 'gate') && !e.opened) {
      const img = decoCanvas(e.t === 'stone' ? 'stone' : e.sky ? 'gchest' : e.t), gy = e.y != null ? e.y + img.height : groundY(e.x + 8);
      if (e.sky) { const tw = Math.sin(world.t * 4) > .6; if (tw) { cx.fillStyle = '#fff6a0'; cx.fillRect(Math.round(e.x - cam) + 4, gy - img.height - 4, 2, 2); } }
      cx.drawImage(img, Math.round(e.x - cam), gy - img.height);
      if (world.near === e) label('n' + e.x, `${e.name || ''}<b>▲ ${e.t === 'sign' || e.t === 'board' ? '看' : e.t === 'gate' ? '推開' : e.t === 'chest' ? '打開' : '使用'}</b>`, e.x + img.width / 2, gy - img.height - 14, 'name');
    } else if (e.t === 'door' && world.near === e) {
      label('door' + e.x, `<b>▲ 進入${e.name || ''}</b>`, e.x + (e.w || 16) / 2, groundY(e.x + 8) - 34, 'name');
    }
  }
  // 主角
  const F = heroSprites(me.look);
  const fr = !hero.onGround ? 'jump' : Math.abs(hero.vx) > 1 ? (Math.floor(hero.anim) % 2 ? 'walk1' : 'walk2') : 'stand';
  const img = hero.face > 0 ? F[fr].r : F[fr].l;
  const hx = Math.round(hero.x - 2 - cam), hy = Math.round(hero.y - 2);
  const wk = WEAPONS[me.eq].kind, ws = weaponSprite(wk);
  cx.drawImage(img, hx, hy);
  if (hero.face > 0) cx.drawImage(ws, hx + 10, hy + 4); else cx.drawImage(flipC(ws), hx - ws.width + 4, hy + 4);
  // 出口提示
  for (const e of world.ents) if (e.t === 'exit') {
    const x = e.side === 'left' ? 2 : world.w * TILE - 30;
    if (Math.abs(x - hero.x) < 140) label('ex' + e.side, (e.side === 'left' ? '◀ ' : '') + (AREAS[e.to] ? AREAS[e.to].name : '') + (e.side === 'right' ? ' ▶' : ''), x + 14, groundY(x + 8) - 44, 'exit');
  }

}
function decoImg(d) {
  if (d.d === 'house') { d._img = d._img || outlined(houseCanvas(d.o)); return d._img; }
  if (d.d === 'tree') return treeCanvas(d.v || 0, !!d.dark);
  return DECO[d.d] ? decoCanvas(d.d) : null;
}

// 滑鼠點地圖：點地面走過去，點 NPC／門走過去並互動
cv.addEventListener('pointerdown', e => {
  if (!world.active) return;
  const R = cv.getBoundingClientRect(), s = R.width / VW;
  const wx = (e.clientX - R.left) / s + world.cam, wy = (e.clientY - R.top) / s;
  let hit = null;
  for (const en of world.ents) {
    if (!en.use) continue;
    const x0 = en.t === 'door' ? en.x : en.x - 4, x1 = en.t === 'door' ? en.x + (en.w || 16) : en.x + 20;
    const gy = groundY(en.x + 8);
    if (wx >= x0 && wx <= x1 && wy >= gy - 44 && wy <= gy + 4) { hit = en; break; }
  }
  if (hit) { world.target = hit.t === 'door' ? hit.x + (hit.w || 16) / 2 : hit.x + 7; world.targetEnt = hit; }
  else { world.target = wx; world.targetEnt = null; }
});

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (world.visible) {
    if (world.active) updateWorld(dt); else world.t += dt;
    drawWorld();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function showWorld(on) {
  world.visible = on;
  $('root').style.visibility = on ? 'visible' : 'hidden';
  $('whud').classList.toggle('hidden', !on);
  $('hint').classList.toggle('hidden', !on);
  if (!on) clearLabels();
}

let W = null;
function newWave() { killWave(); W = { alive: true, timers: [], onKey: null, onRaw: null }; return W; }
function later(fn, ms) { const c = W; const id = setTimeout(() => { if (c && c.alive) fn(); }, ms); c.timers.push(id); return id; }

// 執行一段小遊戲，回傳成績
function runWave(w, A) {

    A.innerHTML = '';

}

// ---------- 滑鼠點擊 ----------
WAVES.click = (w, A, done) => {
  const n = w.duration ? Infinity : w.n, size = w.size || 90, life = (w.life || 3.5) * (w.slow || 1);
  const KINDS = { single: { e: w.e || '🍃', t: w.tl || '點一下' }, double: { e: w.de || '🎁', t: '點兩下' }, right: { e: w.re || '🔮', t: '按右鍵' } };
  const modes = w.mode === 'mix' ? ['single', 'double', 'right'] : w.mode === 'mix2' ? ['single', 'double'] : [w.mode];
  let spawned = 0, hits = 0, wrong = 0, miss = 0, active = 0, ended = false;
  const movers = [];
  const upd = () => setHud(`🎯 ${hits}${isFinite(n) ? ' / ' + n : ''}`);
  upd();
  A.oncontextmenu = e => e.preventDefault();
  A.onmousedown = e => { if (e.target === A) { wrong++; const r = A.getBoundingClientRect(); floatText(A, e.clientX - r.left, e.clientY - r.top, '沒點到', '#c94c4c'); } };
  const end = () => {
    if (ended) return; ended = true;
    done({ score: isFinite(n) ? clamp01((hits - wrong * .2) / n) : clamp01(hits / 40), metric: hits,
      msg: `擊中 ${hits} 個${miss ? `，漏掉 ${miss} 個` : ''}${wrong ? `，按錯 ${wrong} 次` : ''}` });
  };
  function spawn() {
    if (ended || spawned >= n) return;
    spawned++; active++;
    const kind = pick(modes), K = KINDS[kind];
    const el = document.createElement('div');
    el.className = 'tgt k-' + kind; el.style.width = el.style.height = size + 'px';
    const m = { el, x: rnd(12, Math.max(14, A.clientWidth - size - 12)), y: rnd(12, Math.max(14, A.clientHeight - size - 40)), vx: 0, vy: 0 };
    if (w.move) { const a = rnd(0, Math.PI * 2); m.vx = Math.cos(a) * w.move; m.vy = Math.sin(a) * w.move; movers.push(m); }
    el.style.left = m.x + 'px'; el.style.top = m.y + 'px';
    el.innerHTML = `<div class="ring" style="animation-duration:${life}s"></div><div class="te" style="font-size:${size * .55}px">${K.e}</div><div class="tl">${K.t}</div>`;
    A.appendChild(el);
    let gone = false;
    const fin = ok => {
      if (gone) return; gone = true; active--;
      const i = movers.indexOf(m); if (i >= 0) movers.splice(i, 1);
      if (ok) { hits++; SFX.hit(); el.classList.add('pop'); } else { miss++; SFX.miss(); el.classList.add('fade'); }
      setTimeout(() => el.remove(), 320); upd();
      if (spawned < n) later(spawn, ok ? 120 : 250); else if (active === 0) later(end, 250);
    };
    const bad = msg => { wrong++; SFX.wrong(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); floatText(A, m.x, m.y - 10, msg, '#c94c4c'); };
    el.addEventListener('mousedown', e => e.stopPropagation());
    el.addEventListener('click', e => { e.stopPropagation(); if (kind === 'single') fin(true); else if (kind === 'right') bad('要按右鍵'); });
    el.addEventListener('dblclick', e => { e.stopPropagation(); if (kind === 'double') fin(true); });
    el.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); if (kind === 'right') fin(true); else bad(kind === 'double' ? '要點兩下' : '要按左鍵'); });
    later(() => fin(false), life * 1000);
  }
  if (w.move) loop((t, dt) => movers.forEach(m => {
    m.x += m.vx * dt; m.y += m.vy * dt;
    const mw = A.clientWidth - size - 6, mh = A.clientHeight - size - 34;
    if (m.x < 6 || m.x > mw) { m.vx *= -1; m.x = clamp(m.x, 6, mw); }
    if (m.y < 6 || m.y > mh) { m.vy *= -1; m.y = clamp(m.y, 6, mh); }
    m.el.style.left = m.x + 'px'; m.el.style.top = m.y + 'px';
  }));
  for (let i = 0; i < (w.conc || 1); i++) later(spawn, i * 450);
  if (w.duration) clock(w.duration, end);
};

WAVES.drag = (w, A, done) => {
  const set = DRAG_SETS[w.set], nb = set.bins.length, per = Math.ceil(w.k / nb);
  let items = [];
  set.items.forEach((arr, b) => shuffle(arr.slice()).slice(0, per).forEach(t => items.push({ t, b, tries: 0 })));
  items = shuffle(items).slice(0, w.k);
  A.innerHTML = `<div class="dragzone" id="dz"></div><div class="bins">${set.bins.map((b, i) => `<div class="bin" data-b="${i}"><div class="bt">${b}</div><div class="bslot"></div></div>`).join('')}</div>`;
  const dz = $('dz'), bins = [...A.querySelectorAll('.bin')];
  const cols = Math.ceil(items.length / 2), cw = dz.clientWidth / cols, rh = dz.clientHeight / 2;
  let placed = 0, firstOk = 0, finished = false;
  const upd = () => setHud(`✅ ${placed} / ${items.length}`); upd();
  const finish = () => { if (finished) return; finished = true; done({ score: clamp01(firstOk / items.length), msg: `${items.length} 個裡面，一次就放對 ${firstOk} 個` }); };
  items.forEach((it, i) => {
    const el = document.createElement('div'); el.className = 'chip'; el.textContent = it.t; dz.appendChild(el);
    const c = i % cols, r = Math.floor(i / cols);
    it.ox = c * cw + rnd(6, Math.max(8, cw - el.offsetWidth - 6)); it.oy = r * rh + rnd(6, Math.max(8, rh - el.offsetHeight - 6));
    el.style.left = it.ox + 'px'; el.style.top = it.oy + 'px';
    let sx = 0, sy = 0, dragging = false;
    const binAt = (x, y) => bins.find(b => { const R = b.getBoundingClientRect(); return x >= R.left && x <= R.right && y >= R.top && y <= R.bottom; });
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault(); dragging = true; try { el.setPointerCapture(e.pointerId); } catch (x) {}
      el.classList.remove('back'); el.classList.add('dragging');
      const R = el.getBoundingClientRect(); sx = e.clientX - R.left; sy = e.clientY - R.top;
    });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const AR = A.getBoundingClientRect();
      el.style.left = (e.clientX - AR.left - sx) + 'px'; el.style.top = (e.clientY - AR.top - sy) + 'px';
      bins.forEach(b => b.classList.remove('over')); const b = binAt(e.clientX, e.clientY); if (b) b.classList.add('over');
    });
    const drop = e => {
      if (!dragging) return; dragging = false; el.classList.remove('dragging'); bins.forEach(b => b.classList.remove('over'));
      const b = binAt(e.clientX, e.clientY);

        placed++; if (!it.tries) firstOk++; SFX.hit();
        b.querySelector('.bslot').insertAdjacentHTML('beforeend', `<span>${esc(it.t)}</span>`); el.remove(); upd();
        if (placed === items.length) later(finish, 300);

        el.classList.add('back'); el.style.left = it.ox + 'px'; el.style.top = it.oy + 'px';
      }
    };
    el.addEventListener('pointerup', drop); el.addEventListener('pointercancel', drop);
  });
  clock((w.limit || 90) * (w.slow || 1), finish);
};

// ---------- 按鍵雨（字母、數字、注音）----------
WAVES.keyrain = (w, A, done) => {
  const zy = !!w.zy; renderKbd({ zy });
  const n = w.duration ? Infinity : w.n;
  A.innerHTML = '<div class="ground" id="gnd"></div>';
  const items = [];
  let spawned = 0, hits = 0, wrong = 0, miss = 0, last = null, ended = false;
  const fall = w.fall * (w.slow || 1);
  const upd = () => setHud(`💥 ${hits}${isFinite(n) ? ' / ' + n : ''}`); upd();
  const lab = code => zy ? (code === 'Space' ? '一聲' : ZY[code]) : keyLabel(code);
  const spawn = () => {
    if (ended || spawned >= n) return;
    spawned++;
    let code; do { code = pick(w.keys); } while (w.keys.length > 1 && code === last); last = code;
    const el = document.createElement('div'); el.className = 'drop' + (lab(code).length > 2 ? ' small' : '');
    el.textContent = lab(code); el.style.left = rnd(16, Math.max(20, A.clientWidth - 100)) + 'px';
    A.appendChild(el); items.push({ code, el, t0: performance.now(), y: -70 });
  };
  const remove = (it, ok) => {
    items.splice(items.indexOf(it), 1);
    if (ok) { hits++; SFX.hit(); it.el.classList.add('pop'); }
    else { miss++; SFX.miss(); it.el.classList.add('splat'); const g = $('gnd'); if (g) { g.classList.add('bad'); setTimeout(() => g.classList.remove('bad'), 200); } }
    setTimeout(() => it.el.remove(), 320); upd();
  };
  const end = () => {
    if (ended) return; ended = true;
    done({ score: isFinite(n) ? clamp01((hits - wrong * .3) / n) : 1, metric: w.duration ? hits * 60 / w.duration : hits,
      msg: `按對 ${hits} 個${miss ? `，掉到地上 ${miss} 個` : ''}${wrong ? `，按錯 ${wrong} 次` : ''}` });
  };
  let lowest = null;
  loop(t => {
    const H = A.clientHeight; let lo = null;
    for (const it of items.slice()) {
      it.y = -70 + (t - it.t0) / 1000 / fall * (H + 10);
      it.el.style.transform = `translateY(${it.y}px)`;
      if (it.y > H - 64) remove(it, false); else if (!lo || it.y > lo.y) lo = it;
    }
    if (lo !== lowest) { if (lowest) lowest.el.classList.remove('target'); lowest = lo; if (lo) lo.el.classList.add('target'); kbHint(lo ? lo.code : null, zy); }

  W.onKey = e => {
    const c = items.filter(i => i.code === e.code);
    if (c.length) remove(c.reduce((a, b) => a.y > b.y ? a : b), true);
    else { wrong++; SFX.wrong(); kbBad(e.code); }
  };
  if (w.duration) clock(w.duration, end);
};

WAVES.keytour = (w, A, done) => {
  const unit = Math.max(30, Math.min(52, Math.floor((A.clientWidth - 40) / 16)));
  A.innerHTML = `<div class="ktour"><div class="ktask" id="ktask"></div><div class="fullkb">${FULL_KB.map(row => `<div class="krow">${row.map(([code, lb, wd]) =>
    `<div class="fk ${code === 'KeyF' || code === 'KeyJ' ? 'home' : ''}" data-code="${code}" style="width:${Math.round((wd || 1) * unit)}px;font-size:${unit < 40 ? 12 : 15}px">${lb}</div>`).join('')}</div>`).join('')}</div></div>`;
  let i = 0, firstOk = 0, missThis = 0, finished = false;
  const steps = w.steps;
  const keyEls = code => [...A.querySelectorAll('.fk')].filter(k => k.dataset.code === code || (steps[i] && steps[i].alt && steps[i].alt.includes(k.dataset.code)));
  const show = () => {
    A.querySelectorAll('.fk').forEach(k => k.classList.remove('hl', 'ok', 'bad'));
    const s = steps[i]; missThis = 0;

    setHud(`🔍 ${i} / ${steps.length}`);
  };
  const ok = code => {

    i++;

    else later(show, 450);
  };
  const bad = el => { missThis++; SFX.wrong(); if (el) { el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 300); } if (missThis >= 1) keyEls(steps[i].code).forEach(k => k.classList.add('hl')); };
  const match = code => code === steps[i].code || (steps[i].alt && steps[i].alt.includes(code));
  A.querySelectorAll('.fk').forEach(el => el.addEventListener('click', () => {
    if (finished || i >= steps.length) return;
    if (steps[i].mode !== 'click') { toast('這題要按「真的鍵盤」喔！'); return; }
    if (match(el.dataset.code)) ok(el.dataset.code); else bad(el);
  }));
  W.onRaw = e => {
    if (finished || i >= steps.length) return;
    if (steps[i].mode !== 'press') return;
    if (['Tab', 'Backspace', 'Enter', 'Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();

  };
  show();
};

    palette: keys.map(k => ({ col: T.colors[k][0], label: k })),
    overlay: (g, cell, S2) => {

  const S = $('as');

    const r = rounds[ri], Wd = S.clientWidth, Hd = S.clientHeight;
    $('atask').innerHTML = `<b>${ri + 1} / ${rounds.length}</b>　${r.say}`;
    S.innerHTML = '<div class="guide gv hidden" id="gv"></div><div class="guide gh hidden" id="gh"></div>';
    need = r.objs.length;

      const sw = slot.offsetWidth, sh = slot.offsetHeight;
      slot.style.left = (o.tx * Wd - sw / 2) + 'px'; slot.style.top = (o.ty * Hd - sh / 2) + 'px';
      const el = document.createElement('div'); el.className = 'aobj ' + o.cls; el.textContent = o.t; S.appendChild(el);
      const tx = o.tx * Wd - sw / 2, ty = o.ty * Hd - sh / 2;

      if (Math.hypot(x - tx, y - ty) < 60) { x = (tx + Wd / 2) % (Wd - sw); y = (ty + Hd / 3) % (Hd - sh); }
      el.style.left = x + 'px'; el.style.top = y + 'px';
      let sx = 0, sy = 0, on = false, locked = false, snap = false;
      el.addEventListener('pointerdown', e => { if (locked) return; e.preventDefault(); on = true; drags++; const R = el.getBoundingClientRect(); sx = e.clientX - R.left; sy = e.clientY - R.top; try { el.setPointerCapture(e.pointerId); } catch (x2) {} el.classList.add('drag'); });
      el.addEventListener('pointermove', e => {
        if (!on) return;

        if (!on) return; on = false; el.classList.remove('drag'); $('gv').classList.add('hidden'); $('gh').classList.add('hidden');

        }
      });
    });
    setHud(`📐 ${ri} / ${rounds.length}`);
  };
  show();
  clock((w.limit || 150) * (w.slow || 1), () => { if (ended) return; ended = true; done({ score: ri / rounds.length * .8, msg: '時間到' }); });

const CONDS = { wall: '前方是牆壁？', open: '前方沒有牆壁？', goal: '碰到旗子？', star: '碰到星星？', water: '前方是水？',
  red: '顏色感應器＝紅色？', blue: '顏色感應器＝藍色？', yellow: '顏色感應器＝黃色？', near: '距離感應器＜1 格？', score3: '分數＝3？' };

const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
let BUID = 1;
// 解答簡寫 → 積木：'move' 或 ['move',3] 或 ['repeat',4,[...]] 或 ['ifelse','wall',[...],[...]]
function bParse(list) {
  return list.map(x => {
    const k = Array.isArray(x) ? x[0] : x, D = BLK[k], b = { id: BUID++, k };
    if ('n' in D) b.n = D.n; if ('s' in D) b.s = D.s; if ('cond' in D) b.cond = D.cond; if ('face' in D) b.face = D.face;
    if (D.c) { b.kids = []; if (D.two) b.kids2 = []; }
    if (Array.isArray(x)) {
      let i = 1;
      if ('n' in D) b.n = x[i++]; else if ('s' in D) b.s = x[i++]; else if ('cond' in D) b.cond = x[i++]; else if ('face' in D) b.face = x[i++];
      if (D.c) { b.kids = bParse(x[i++] || []); if (D.two) b.kids2 = bParse(x[i++] || []); }
    }
    return b;
  });
}
const bCount = list => list.reduce((s, b) => s + (BLK[b.k].hat ? 0 : 1) + (b.kids ? bCount(b.kids) : 0) + (b.kids2 ? bCount(b.kids2) : 0), 0);
const bHas = (list, k) => list.some(b => b.k === k || (b.kids && bHas(b.kids, k)) || (b.kids2 && bHas(b.kids2, k)));
const bText = (list, ind = 0) => list.map(b => {
  const D = BLK[b.k];
  const t = D.t.replace('{n}', `(${b.n})`).replace('{s}', `[${b.s}]`).replace('{cond}', `<${CONDS[b.cond]}>`).replace('{face}', b.face || '');
  return '　'.repeat(ind) + t + (D.c ? '\n' + bText(b.kids, ind + 1) + (D.two ? '\n' + '　'.repeat(ind) + '否則\n' + bText(b.kids2, ind + 1) : '') : '');
}).join('\n');

    <div class="bmain">

  }

  const render = () => { root.innerHTML = stackHtml(script, 'R', true); setHud(`🧩 ${bCount(script)} 塊${w.max ? ` / 建議 ${w.max} 塊內` : ''}`); };

  const inSc = (x, y) => { const R = sc.getBoundingClientRect(); return x >= R.left && x <= R.right && y >= R.top && y <= R.bottom; };
  const bestSlot = e => {
    if (!inSc(e.clientX, e.clientY)) return null;

    let best = null, bd = 1e9; slotList().forEach(s => { const d = Math.abs(gy - s.y) + Math.abs(gx - s.x) * .6; if (d < bd) { bd = d; best = s; } });

  };

    render();

  addEventListener('pointermove', onMove); addEventListener('pointerup', onUp);
  const cleanup = () => { removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); document.querySelectorAll('.bghost').forEach(x => x.remove()); };

  // ===== 舞台與執行 =====
  const rows = w.grid.length, cols = w.grid[0].length;
  const cell = Math.floor(Math.min(46, 300 / cols, 270 / rows));
  cvs.width = cols * cell; cvs.height = rows * cell;
  const startOf = () => { for (let y = 0; y < rows; y++) { const x = w.grid[y].indexOf('S'); if (x >= 0) return { x, y }; } return { x: 0, y: 0 }; };
  const targetCells = new Set(); w.grid.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '+' || (ch === 'S' && (w.goal || {}).shape)) targetCells.add(x + ',' + y); }));
  let S;
  const reset = () => {
    const st = startOf();

  };
  const total = ch => w.grid.join('').split(ch).length - 1;
  const cellAt = (x, y) => (x < 0 || y < 0 || x >= cols || y >= rows) ? '#' : S.grid[y][x];
  const ahead = () => { const [dx, dy] = DIRS[S.d]; return cellAt(S.x + dx, S.y + dy); };
  const testCond = c => ({ wall: () => ahead() === '#', open: () => ahead() !== '#', near: () => ahead() === '#', goal: () => S.grid[S.y][S.x] === 'G', star: () => w.grid[S.y][S.x] === '*',
    water: () => ahead() === '~', red: () => S.grid[S.y][S.x] === 'R', blue: () => S.grid[S.y][S.x] === 'B', yellow: () => S.grid[S.y][S.x] === 'Y', score3: () => S.score === 3 })[c]();
  const step = sgn => {
    const [dx, dy] = DIRS[S.d], nx = S.x + dx * sgn, ny = S.y + dy * sgn, ch = cellAt(nx, ny);
    if (ch === '#') { S.crash = robot ? '機器人撞到牆了！' : '撞到牆壁了！'; return; }

    if (ch === '~') { S.crash = '掉進水裡了！'; return; }

  function* runList(list) { for (const b of list) { if (S.crash || S.steps > 500) return; yield* runBlk(b); } }
  function* runBlk(b) {
    S.steps++;
    switch (b.k) {
      case 'move': case 'fwd': for (let i = 0; i < b.n; i++) { step(1); yield 'mv'; if (S.crash) return; } break;
      case 'back': for (let i = 0; i < b.n; i++) { step(-1); yield 'mv'; if (S.crash) return; } break;
      case 'turnR': case 'rR': S.d = (S.d + 1) % 4; yield 'turn'; break;
      case 'turnL': case 'rL': S.d = (S.d + 3) % 4; yield 'turn'; break;
      case 'say': S.said = String(b.s); S.bubble = String(b.s); yield 'say'; break;
      case 'costume': S.costume ^= 1; yield 'turn'; break;
      case 'meow': case 'beep': SFX.go(); yield 'turn'; break;
      case 'light': S.face = b.face; yield 'turn'; break;
      case 'wait': yield 'wait'; break;

      case 'penup': S.pen = false; yield 'loop'; break;

      case 'addv': S.score += Number(b.n); yield 'turn'; break;

      case 'armUp': if (S.holding) { S.holding = false; if (w.grid[S.y][S.x] === 'D') { S.delivered++; SFX.coin(); } else S.grid[S.y][S.x] = 'o'; } yield 'turn'; break;

  }

    if (G.say != null && normZh(S.said) !== normZh(G.say)) return `💬 角色要說「${G.say}」。`;

  const killRun = () => { if (!W) return; W.timers.forEach(id => clearTimeout(id)); W.timers = []; startClock(); };
  $('bhint').onclick = () => { hints = 1; msg('💡 參考答案：<pre class="bsol">' + esc(bText(bParse(w.sol))) + '</pre>', ''); };
  W.onKey = e => { if (e.code === 'Space' && !running && !ended && w.keyGoal) { const L = hats('key'); if (!L.length) return msg('沒有「當 空白鍵 被按下」的程式喔！', 'bad'); exec(L, false); } };
  W.blocks = { load: list => { script = bParse(list); render(); }, run: () => $('brun').click(), get: () => script, w };
  // 畫面
  const draw = () => {
    S.dx += (S.x - S.dx) * .35; S.dy += (S.y - S.dy) * .35;
    g.clearRect(0, 0, cvs.width, cvs.height);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const ch = S.grid[y][x], X = x * cell, Y = y * cell, base = w.grid[y][x];
      g.fillStyle = robot ? ((x + y) % 2 ? '#f4f6f8' : '#e9edf1') : ((x + y) % 2 ? '#bfe6a3' : '#b2dd94'); g.fillRect(X, Y, cell, cell);
      if (base === 'R' || base === 'B' || base === 'Y') { g.fillStyle = { R: '#ff5b5b', B: '#4c8dff', Y: '#ffd23f' }[base]; g.fillRect(X + 2, Y + 2, cell - 4, cell - 4); }
      if (base === 'D') { g.fillStyle = '#fff3b0'; g.fillRect(X + 2, Y + 2, cell - 4, cell - 4); g.strokeStyle = '#e0a800'; g.setLineDash([4, 3]); g.strokeRect(X + 3, Y + 3, cell - 6, cell - 6); g.setLineDash([]); }

      g.fillStyle = '#ffd23f'; g.fillRect(-cell * .3, -cell * .3, cell * .6, cell * .6); g.fillStyle = '#fff'; g.fillRect(-cell * .2, -cell * .2, cell * .34, cell * .4);
      g.fillStyle = '#22a6c8'; g.fillRect(cell * .3, -cell * .1, cell * .1, cell * .2);
      if (S.holding) { g.font = `${Math.floor(cell * .4)}px "Segoe UI Emoji",sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('📦', cell * .42, 0); }
    } else {

      g.font = `${Math.floor(cell * .7)}px "Segoe UI Emoji",sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(S.costume ? '😺' : '🐱', 0, 2);
      g.rotate(S.d * Math.PI / 2); g.fillStyle = '#e04f3f'; g.beginPath(); g.moveTo(cell * .5, 0); g.lineTo(cell * .34, -cell * .1); g.lineTo(cell * .34, cell * .1); g.fill();

    if (S.bubble) {

      $('zwhy').innerHTML = `${ok ? '✅ 答對了！' : '❌ 再想想～'}　${Q.why || ''}<br><button class="pbtn small green" id="znext">${i + 1 < list.length ? '下一題 ▶' : '完成 ✔'}</button>`;
      setHud(`🤔 ${right} / ${list.length}`);
      $('znext').onclick = () => { i++; if (i >= list.length) { ended = true; done({ score: right / list.length, msg: `${list.length} 題答對 ${right} 題` }); } else show(); };
    });
  };
  show();
};

async function monsterTurn() {
  const st = B.st, M = st.M;

  const times = !sp && hasT(st, 'double') && Math.random() < .3 ? 2 : 1;
  for (let k = 0; k < times; k++) {
    let block;
    if (sp) { await say('⚠️ ' + sp.say, 1800); block = await challenge('🛡️ ' + sp.say.split('！')[0] + '！', sp.w); }
    else { await say(k ? `⚡ 連擊！${st.name}又攻擊了！` : M.say, 900); block = await challenge('🛡️ 防禦！', guardWave(st)); }

    const raw = M.atk + st.atkBonus + irnd(0, 2) + (sp ? 3 : 0);
    const dmg = Math.max(0, Math.round(raw * (1 - .8 * block)));

}
async function battleLoop() {
  const st = B.st, M = st.M;
  while (!st.over) {
    const wpn = WEAPONS[me.eq], K = KIND[wpn.kind], S = SKILLS[wpn.kind];
    const cmd = await cmdButtons([
      { t: `⚔️ 攻擊`, sub: `${K.icon} ${wpn.n}：${K.how}`, v: 'atk', cls: 'red' },
      { t: `✨ 大絕招`, sub: st.energy >= 100 ? `${S.n}：${S.how}` : `能量 ${st.energy}%（集滿才能用）`, v: 'skill', cls: 'blue', dis: st.energy < 100 },
      { t: '🎒 道具', sub: '藥水、卷軸…', v: 'item' },
      { t: '🔄 換武器', sub: `弱點：${KIND[M.weak].icon}${KIND[M.weak].n}`, v: 'swap' },
      { t: '🏃 逃跑', sub: M.boss ? '魔王戰不能逃' : '回到地圖', v: 'run', cls: 'gray', dis: !!M.boss }]);
    if (cmd === 'swap') { await swapWeapon(); continue; }
    if (cmd === 'run') { await say('你逃跑了！', 800); return endBattle('run'); }
    if (cmd === 'item') { const used = await useItem(); if (!used) continue; }
    if (cmd === 'atk' || cmd === 'skill') await heroAttack(cmd === 'skill');
    if (st.hp <= 0) return endBattle('win');
    if (!(await monsterTurn())) return endBattle('lose');
  }
}

async function endBattle(result) {

function rollDrop(st) {

      ents.push({ t: 'door', x: x + w / 2 - 6, w: 12, name: it.label.replace(/^\S+\s/, ''), use: () => talkTo(it.npc) });

    if (it.stone) { ents.push({ t: 'stone', x: x + 6, name: '傳送石', use: () => travel() }); ents.push(boardEnt(x + 34)); x += 60; }

function makeBounties() {

  const pool = [
    () => { const k = pk(kinds), n = 3 + Math.floor(r() * 3); return { type: 'kill', kind: k, need: n, text: `打倒 ${n} 隻${MONS[k].n}`, gold: 25 + n * 6 }; },
    () => ({ type: 'chests', need: 2, text: '打開 2 個寶箱', gold: 40 }),
    () => ({ type: 'perfects', need: 3, text: '完美防禦 3 次', gold: 35 }),
    () => ({ type: 'skills', need: 2, text: '放出 2 次大絕招', gold: 40 }),
    () => ({ type: 'crits', need: 3, text: '打出 3 次會心一擊', gold: 40 }),
    () => ({ type: 'mini', need: 1, text: '在任何複習小遊戲拿到 ★★ 以上', gold: 45 }),
    () => ({ type: 'kills', need: 8, text: '打倒任意 8 隻怪物', gold: 45 })];
  if (kinds.length) list.push(pool[0]());
  while (list.length < 3) { const b = pk(pool.slice(1))(); if (!list.some(x => x.type === b.type)) list.push(b); }
  list.forEach(b => { b.have = 0; b.claimed = false; b.item = pk(['potion', 'potion', 'bomb', 'hourglass', 'meal']); });
  return { date: today(), list, bonus: false };
}

// prev：以前學期的摘要 [{ grade, sem, quest, done, hidden, legend }]
function legacyOfCode(d) {
  const Q = (PACKS[d.grade + '-' + d.sem] || { quests: [] }).quests;
  return { grade: d.grade, sem: d.sem, quest: d.quest, done: Q.length > 0 && d.quest >= Q.length - 1, legend: d.weapons.includes('legend'), best: d.best };
}
function legacyOfProfile(p) {
  const Q = (PACKS[p.grade + '-' + p.sem] || { quests: [] }).quests;
  return { grade: p.grade, sem: p.sem, quest: p.quest, done: Q.length > 0 && p.quest >= Q.length - 1, legend: (p.weapons || []).includes('legend') || !!(p.flags && p.flags.hiddenDone), best: p.best || {} };
}
function applyLegacy(p, prev) {
  if (!prev || !prev.length || p.flags.legacy) return;
  const done = prev.filter(x => x.done).length, legend = prev.filter(x => x.legend).length, tried = prev.length;
  const gold = 20 + tried * 10 + done * 30 + legend * 40;
  p.gold += gold; p.items.potion = (p.items.potion || 0) + Math.min(4, 1 + done);
  if (legend) p.items.meal = (p.items.meal || 0) + 1;
  prev.forEach(x => Object.keys(p.best).forEach(k => { p.best[k] = Math.max(p.best[k] || 0, (x.best && x.best[k]) || 0); }));
  const title = legend ? '😈 傳說勇者' : done >= 3 ? '🌟 資深勇者' : done ? '🎖️ 老練勇者' : '🌱 回來的勇者';
  p.flags.legacy = 1; p.title = title;
  p.legacyMsg = [['fairy', `歡迎回來！我記得你，你已經冒險過 ${tried} 個學期了！`],
    ['fairy', `你打倒過 ${done} 個大魔王${legend ? `，還拿過 ${legend} 次傳說之劍` : ''}。這是給你的傳承獎勵！`],
    [null, `獲得：🪙 ${gold} 金幣、🧪 補血藥水${legend ? '、🍱 勇者便當' : ''}、稱號「${title}」`],
    ['fairy', '不過等級和武器要重新開始喔，新的冒險、新的挑戰！']];
}

const UI = { enter: null, dialogOpen: false, dialogNext: null, busy: false };

// ---------- 對話（不能跳過，一句一句按）----------
function portrait(id) {
  const box = document.createElement('div'); box.className = 'por';
  let img;
  if (id === 'hero') img = heroSprites(me.look).stand.r; else if (id && NPC_DEF[id]) img = npcSprite(id); else img = npcSprite('fairy');
  const c = scaled(img, 6); box.appendChild(c); return box;
}
function dialog(lines) {
  return new Promise(res => {
    const wasActive = world.active; world.active = false;
    KEYS.ArrowLeft = KEYS.ArrowRight = KEYS.KeyA = KEYS.KeyD = false;
    let i = 0, typing = null, full = '';
    const d = $('dialog');
    d.classList.remove('hidden'); UI.dialogOpen = true;
    const show = () => {
      const [who, text] = lines[i];
      d.innerHTML = ''; d.appendChild(portrait(who));
      const body = document.createElement('div'); body.style.flex = '1';
      body.innerHTML = `<div class="dn">${who ? (NPC_DEF[who] ? NPC_DEF[who].n : who === 'hero' ? esc(me.name) : '') : '📖 旁白'}</div><div class="dt" id="dt"></div><div class="dmore">▼ 按空白鍵或點一下</div>`;
      d.appendChild(body);
      full = text; let k = 0; clearInterval(typing);
      typing = setInterval(() => { k += 2; $('dt').textContent = full.slice(0, k); if (k % 6 === 0) SFX.talk(); if (k >= full.length) { clearInterval(typing); typing = null; } }, 30);
    };
    const next = () => {
      if (typing) { clearInterval(typing); typing = null; $('dt').textContent = full; return; }
      i++;
      if (i >= lines.length) { d.classList.add('hidden'); d.innerHTML = ''; UI.dialogOpen = false; UI.dialogNext = null; d.onclick = null; if (wasActive && !UI.busy) world.active = true; res(); return; }
      show();
    };
    UI.dialogNext = next;
    d.onclick = next;
    show();
  });
}
function choose(who, text, opts) {
  return new Promise(res => {
    world.active = false;
    const d = $('dialog');
    d.classList.remove('hidden'); UI.dialogOpen = false;
    d.innerHTML = ''; d.onclick = null; d.appendChild(portrait(who));
    const body = document.createElement('div'); body.style.flex = '1';
    body.innerHTML = `<div class="dn">${who && NPC_DEF[who] ? NPC_DEF[who].n : ''}</div><div class="dt">${esc(text)}</div><div class="dch">${opts.map((o, i) => `<button class="pbtn small ${o.v == null ? 'gray' : ''}" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>`;
    d.appendChild(body);
    body.querySelectorAll('button').forEach(b => b.onclick = e => { e.stopPropagation(); SFX.go(); d.classList.add('hidden'); d.innerHTML = ''; res(opts[Number(b.dataset.i)].v); });
  });
}
async function talkTo(id) {
  if (UI.busy || !world.active) return;
  UI.busy = true; world.active = false;
  try { await TALK[id](); } finally { UI.busy = false; if (!B.st && !$('ov').innerHTML) world.active = true; updateHUD(); }
}

// ---------- HUD ----------
function updateHUD() {
  if (!me) return;
  $('hName').textContent = (me.title ? me.title.split(' ')[0] + ' ' : '') + me.name; $('hLv').textContent = 'Lv' + me.lv; $('hGold').textContent = '🪙 ' + me.gold;
  $('hHp').innerHTML = `<i style="width:${clamp(me.hp / maxHp(me), 0, 1) * 100}%"></i><span>${me.hp} / ${maxHp(me)}</span>`;
  $('hExp').innerHTML = `<i style="width:${clamp(me.exp / expNeed(me), 0, 1) * 100}%"></i><span>${me.exp} / ${expNeed(me)}</span>`;
  const q = QUESTS[me.quest];
  $('hQt').textContent = q ? `📜 ${q.t}${q.need ? `（${me.qn}/${q.need}）` : ''}` : '';
  $('hQg').textContent = q ? q.g : '';
  $('hArea').textContent = world.A ? '📍 ' + world.A.name : '';
}

function useOutside(k) { if (!me.items[k]) return; me.items[k]--; me.hp = Math.min(maxHp(me), me.hp + (k === 'potion' ? 25 : maxHp(me))); saveMe(); updateHUD(); SFX.heal(); openBag(); }

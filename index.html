function openSettings() {
  if (!me || B.st) return;
  openModal(`<div class="mtitle">⚙️ 設定 <button class="pbtn small gray" style="margin-left:auto" onclick="closeModal()">關閉</button></div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
    <button class="pbtn" onclick="toggleMute();openSettings()">${muted ? '🔇 音效：關' : '🔊 音效：開'}</button>
    <button class="pbtn blue" onclick="openCode()">🔑 看通關密碼</button>
    <button class="pbtn gray" onclick="askBox({title:'回標題',text:'要回到標題畫面嗎？進度已自動保存在這台電腦。'}).then(v=>{if(v){closeModal();showTitle();}})">🏠 回標題（換人）</button>
    <div style="font-weight:800">小提示：按 F11 可以全螢幕。</div></div>`);
}
function openShop(type) {
  world.active = false;
  const body = type === 'weapon'
    ? WEAPON_ORDER.filter(id => WEAPONS[id].price > 0 && (!PACK.shop || PACK.shop.includes(id))).map(id => { const w = WEAPONS[id], K = KIND[w.kind], own = me.weapons.includes(id);
        return `<div class="icard ${own ? 'eq' : ''}"><div class="in">${K.icon} ${w.n}　攻擊 ${w.atk}</div><div class="id">${K.n}：${K.how}<br>擅長打：${K.good}</div>
          ${own ? '<b>✅ 已擁有</b>' : `<button class="pbtn small" ${me.gold < w.price ? 'disabled' : ''} onclick="buy('w','${id}')">🪙 ${w.price} 購買</button>`}</div>`; }).join('')
    : Object.keys(ITEMS).map(k => `<div class="icard"><div class="in">${ITEMS[k].icon} ${ITEMS[k].n}（有 ${me.items[k] || 0} 個）</div><div class="id">${ITEMS[k].desc}</div>
        <button class="pbtn small" ${me.gold < ITEMS[k].price ? 'disabled' : ''} onclick="buy('i','${k}')">🪙 ${ITEMS[k].price} 購買</button></div>`).join('');
  openModal(`<div class="mtitle">${type === 'weapon' ? '⚒️ 鐵匠鋪' : '🌿 藥草屋'}<span style="font-size:18px">🪙 ${me.gold}</span><button class="pbtn small gray" style="margin-left:auto" onclick="closeModal()">離開</button></div>
    <div class="grid2">${body}</div>${type === 'weapon' ? '<p style="font-weight:800">買了新武器記得到「🎒 背包」裝備，或戰鬥中按「🔄 換武器」。</p>' + upgradeHtml() : ''}`);
  UI.shop = type;
}
function buy(t, id) {
  const price = t === 'w' ? WEAPONS[id].price : ITEMS[id].price;
  if (me.gold < price) return toast('金幣不夠喔！');
  me.gold -= price;
  if (t === 'w') { me.weapons.push(id); toast(`買到 ${WEAPONS[id].n}！`); } else { me.items[id] = (me.items[id] || 0) + 1; toast(`買到 ${ITEMS[id].n}！`); }
  saveMe(); updateHUD(); SFX.coin(); openShop(UI.shop);
}

// ---------- 標題、登入、建立角色 ----------
let pickGrade = 3, pickSem = autoSem();
function showTitle() {
  showWorld(false); me = null; $('ov').innerHTML = ''; $('modal').innerHTML = '';
  const m = new Date().getMonth() + 1;
  const sems = PACKS;
  $('screen').innerHTML = `<div class="title">
    <div style="font-size:46px">🗡️⌨️🖱️</div><div class="logo">鍵盤勇者</div><div class="sublogo">像素冒險 RPG</div>
    <div class="pdark" style="padding:16px 18px">
      <div style="font-weight:900;font-size:20px">① 選年級</div>
      <div class="grades">${[3, 4, 5, 6].map(g => `<button class="pbtn ${g === pickGrade ? 'on' : ''}" onclick="pickGrade=${g};showTitle()">${g} 年級</button>`).join('')}</div>
      <div style="font-weight:900;font-size:20px;margin-top:8px">② 選學期 <span style="font-size:14px;color:#d8c7a6">（現在是 ${m} 月，預設${SEM_NAME[autoSem()]}學期）</span></div>
      <div class="grades">${[0, 1].map(s => `<button class="pbtn ${s === pickSem ? 'on' : ''}" onclick="pickSem=${s};showTitle()">${SEM_NAME[s]}學期</button>`).join('')}</div>
      <div style="margin-top:14px;font-size:22px;font-weight:900;color:#ffe3a3">${sems[pickGrade + '-' + pickSem] ? `${pickGrade}${SEM_NAME[pickSem]}：${sems[pickGrade + '-' + pickSem].title}` : `${pickGrade}${SEM_NAME[pickSem]}：🔒 製作中，敬請期待`}</div>
      <div style="margin-top:12px"><button class="pbtn green big" ${sems[pickGrade + '-' + pickSem] ? '' : 'disabled'} onclick="showLogin()">▶ 開始冒險</button></div>
    </div>
    <div style="margin-top:12px;font-size:13px;color:#a89a80">秉亨老師 × Claude 協同製作　｜　<button class="link" onclick="showTeacher()">👩‍🏫 老師專區</button></div></div>`;
  UI.enter = () => { if (PACKS[pickGrade + '-' + pickSem]) showLogin(); };
}
function showLogin() {
  usePack(pickGrade, pickSem);
  const list = Object.values(profiles).filter(p => p.grade === pickGrade && p.sem === pickSem).sort((a, b) => a.id.localeCompare(b.id));
  $('screen').innerHTML = `<div class="px" style="width:min(560px,96vw);padding:22px 26px;text-align:center">
    <h2 style="margin:0 0 4px">${pickGrade}${SEM_NAME[pickSem]}　勇者登記處</h2><div style="font-weight:800;color:#7a4e2d;margin-bottom:8px">${PACK.title}</div>
    <div class="field"><label>班級</label><input id="inCls" placeholder="例如 301" maxlength="6"></div>
    <div class="field"><label>座號</label><input id="inSeat" type="number" min="1" max="63" placeholder="例如 12"></div>
    <div class="field"><label>勇者名字</label><input id="inName" placeholder="可以取綽號" maxlength="8"></div>
    <div class="field hidden" id="codeField"><label>通關密碼</label><input id="inCode" placeholder="XXXX-XXXX-XXXX" maxlength="16" style="font-family:Consolas,monospace;text-transform:uppercase"></div>
    <div style="margin-top:12px;display:flex;gap:10px;justify-content:center"><button class="pbtn gray" onclick="showTitle()">◀ 返回</button><button class="pbtn green big" onclick="doLogin()">出發！</button></div>
    <div style="margin-top:10px"><button class="link" onclick="$('codeField').classList.toggle('hidden');$('inCode').focus()">我有通關密碼（換電腦、電腦被還原時用）</button></div>
    ${list.length ? `<div style="margin-top:12px;font-weight:900">這台電腦的勇者：</div><div class="plist">${list.map(p => `<button class="pbtn small" onclick="loginAs('${esc(p.id)}')">${esc(p.cls)}-${p.seat} ${esc(p.name)} Lv${p.lv}</button>`).join('')}</div>` : ''}
  </div>`;
  UI.enter = doLogin;
  setTimeout(() => $('inCls') && $('inCls').focus(), 50);
}
function doLogin() {
  usePack(pickGrade, pickSem);
  const cls = $('inCls').value.trim(), seat = parseInt($('inSeat').value, 10), name = $('inName').value.trim();
  if (!cls) return toast('請輸入班級'), $('inCls').focus();
  if (!(seat >= 1 && seat <= 63)) return toast('請輸入座號（1～63）'), $('inSeat').focus();
  const id = `${pickGrade}${SEM_NAME[pickSem]}-${cls}-${seat}`;
  const codeStr = $('inCode').value.trim();
  let p = profiles[id];
  if (codeStr) {
    const d = readCode(codeStr);
    if (!d) return toast('通關密碼不對，請再檢查一次');
    if (d.grade !== pickGrade || d.sem !== pickSem) return toast(`這組密碼是 ${d.grade}${SEM_NAME[d.sem]} 的，請回上一頁選對年級學期`);
    if (d.seat !== seat) return toast(`這組密碼是 ${d.seat} 號的，請確認座號`);
    if (!p || p.quest < d.quest || p.lv < d.lv) {
      p = p || newProfile(pickGrade, pickSem, cls, seat, name || '勇者', 0);
      Object.assign(p, { lv: Math.max(p.lv, d.lv), gold: Math.max(p.gold, d.gold), quest: Math.max(p.quest, d.quest), eq: d.eq });
      p.weapons = [...new Set(p.weapons.concat(d.weapons))]; p.best.key = Math.max(p.best.key || 0, d.best.key); p.best.mouse = Math.max(p.best.mouse || 0, d.best.mouse);
      p.qn = 0; p.hp = maxHp(p); p.area = null; p.x = null;
      Object.assign(p.flags, bossFlagsUpTo(p.quest));
      p.flags.intro = 1; p.flags.tutBattle = 1;
      toast('進度恢復了！');
    }
  }
  if (p) { if (name) p.name = name; me = p; saveMe(); return startGame(); }
  showCreate(cls, seat, name);
}
function loginAs(id) { me = profiles[id]; startGame(); }
function showCreate(cls, seat, name) {
  let look = 0;
  const render = () => {
    $('screen').innerHTML = `<div class="px" style="width:min(640px,96vw);padding:22px 26px;text-align:center">
      <h2 style="margin:0">選擇你的勇者造型</h2>
      <div class="looks">${LOOKS.map((L, i) => `<button class="${i === look ? 'on' : ''}" data-i="${i}"></button>`).join('')}</div>
      <div style="font-weight:900;font-size:18px">${LOOKS[look].n}</div>
      <div class="field" style="max-width:380px;margin:10px auto"><label>名字</label><input id="cName" value="${esc(name || '')}" placeholder="勇者的名字" maxlength="8"></div>
      ${pickGrade * 2 + pickSem > 6 ? `<div class="field" style="max-width:460px;margin:6px auto"><label style="font-size:15px">上學期密碼<br><small>（選填）</small></label><input id="cPrev" placeholder="有的話可以拿傳承獎勵" maxlength="17" style="font-family:Consolas,monospace;text-transform:uppercase"></div>` : ''}
      <div style="display:flex;gap:10px;justify-content:center"><button class="pbtn gray" onclick="showLogin()">◀ 返回</button><button class="pbtn green big" id="cGo">✨ 建立勇者</button></div></div>`;
    $('screen').querySelectorAll('.looks button').forEach(b => {
      const c = scaled(heroSprites(Number(b.dataset.i)).stand.r, 6); b.appendChild(c);
      b.onclick = () => { name = $('cName').value; look = Number(b.dataset.i); render(); SFX.go(); };
    });
    const go = () => {
      let prev = null;
      const pv = $('cPrev') && $('cPrev').value.trim();
      if (pv) {
        const d = readCode(pv);
        if (!d) return toast('上學期的密碼不對，請再檢查一次（不填也可以）');
        if (d.grade * 2 + d.sem >= pickGrade * 2 + pickSem) return toast('這組密碼不是以前學期的喔！');
        prev = [legacyOfCode(d)];
      }
      me = newProfile(pickGrade, pickSem, cls, seat, $('cName').value.trim() || '勇者', look);
      if (prev) applyLegacy(me, prev);
      saveMe(); startGame();
    };
    $('cGo').onclick = go; UI.enter = go;
  };
  render();
}
async function startGame() {
  $('screen').innerHTML = ''; UI.enter = null;
  showWorld(true); fitStage();
  usePack(me.grade, me.sem);
  ensureExtra(me);
  enterArea(me.area && AREAS[me.area] ? me.area : PACK.home, me.area && AREAS[me.area] ? (me.x ?? undefined) : 300, 1);
  world.active = true;
  if (!me.flags.intro) { me.flags.intro = 1; saveMe(); await dialog(STORY_INTRO); }
  if (me.legacyMsg) { const L0 = me.legacyMsg; delete me.legacyMsg; saveMe(); world.active = false; await dialog(L0); world.active = true; updateHUD(); }
}

// ---------- 老師專區 ----------
const qOf = d => (PACKS[d.grade + '-' + d.sem] || { quests: [] }).quests;
async function showTeacher() {
  const pin = await askBox({ title: '👩‍🏫 老師專區', text: '請輸入老師密碼', input: true, password: true });
  if (pin === null) return;
  if (pin !== TEACHER_PIN) return toast('密碼不對');
  teacherPanel();
}
function teacherPanel() {
  showWorld(false);
  if (!PACKS[pickGrade + '-' + pickSem]) { pickGrade = 3; pickSem = 0; }
  usePack(pickGrade, pickSem);
  $('screen').innerHTML = `<div class="px" style="width:min(1000px,98vw);max-height:96vh;overflow:auto;padding:20px">
    <h2 style="margin-top:0">👩‍🏫 老師專區</h2>
    <h3>① 全班進度（貼上學生的通關密碼）</h3>
    <div style="font-weight:700">一行一位，格式隨意，例如「12 王小明 ABCD-EFGH-JKLM」，系統會自動抓密碼。</div>
    <textarea id="codes" rows="7"></textarea>
    <div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap"><button class="pbtn" onclick="teacherParse()">整理成表格</button><button class="pbtn green" onclick="teacherCsv()">下載 CSV</button></div>
    <div id="ttable"></div>
    <h3 style="margin-top:20px">② 示範帳號（上課展示用）</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="tsem" onchange="teacherSem(this.value)">${Object.keys(PACKS).map(k => `<option value="${k}" ${k === pickGrade + '-' + pickSem ? 'selected' : ''}>${k[0]}${SEM_NAME[k[2]]}：${PACKS[k].title}</option>`).join('')}</select>
      <span style="font-weight:800">跳到任務：</span>
      <select id="tq">${QUESTS.map((q, i) => `<option value="${i}">${i + 1}. ${q.t}</option>`).join('')}</select>
      <button class="pbtn orange blue" onclick="teacherDemo()">▶ 用示範帳號進入</button></div>
    <h3 style="margin-top:20px">③ 這台電腦的勇者</h3>
    <div id="tlocal"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="pbtn red" onclick="teacherClear()">清除這台電腦所有勇者資料</button><button class="pbtn gray" onclick="showTitle()">回標題</button></div></div>`;
  teacherLocal();
}
let teacherRows = [];
function teacherParse() {
  teacherRows = [];
  $('codes').value.split(/\n/).forEach(line => {
    const m = line.toUpperCase().match(/[0-9A-Z]{5}-?[0-9A-Z]{5}-?[0-9A-Z]{5}/);
    if (!m) return;
    const d = readCode(m[0]);
    teacherRows.push({ label: line.replace(new RegExp(m[0].replace(/-/g, '-?'), 'i'), '').trim(), code: m[0], d });
  });
  teacherRows.sort((a, b) => (a.d ? a.d.seat : 99) - (b.d ? b.d.seat : 99));
  $('ttable').innerHTML = `<table class="t"><tr><th>座號</th><th>備註</th><th>年級學期</th><th>等級</th><th>任務進度</th><th>金幣</th><th>武器數</th><th>滑鼠紀錄</th><th>按鍵紀錄</th><th>中打</th><th>英打</th></tr>
    ${teacherRows.map(r => r.d ? `<tr><td>${r.d.seat}</td><td>${esc(r.label)}</td><td>${r.d.grade}${SEM_NAME[r.d.sem]}</td><td>${r.d.lv}</td><td>${r.d.quest}/${qOf(r.d).length - 1} ${qOf(r.d)[r.d.quest] ? qOf(r.d)[r.d.quest].t : ''}</td><td>${r.d.gold}</td><td>${r.d.weapons.length}</td><td>${r.d.best.mouse}</td><td>${r.d.best.key}</td><td>${r.d.best.zh}</td><td>${r.d.best.en}</td></tr>`
      : `<tr><td colspan="11" style="color:#c94c4c">${esc(r.label)} ${esc(r.code)}：密碼有誤（可能抄錯）</td></tr>`).join('')}</table>`;
}
function teacherCsv() {
  if (!teacherRows.length) teacherParse();
  const head = ['座號', '備註', '年級學期', '等級', '任務進度', '目前任務', '金幣', '武器數', '滑鼠靶場', '按鍵雨', '中打字每分', '英打WPM'];
  const rows = teacherRows.filter(r => r.d).map(r => [r.d.seat, r.label, r.d.grade + SEM_NAME[r.d.sem], r.d.lv, r.d.quest, qOf(r.d)[r.d.quest] ? qOf(r.d)[r.d.quest].t : '', r.d.gold, r.d.weapons.length, r.d.best.mouse, r.d.best.key, r.d.best.zh, r.d.best.en]);
  const csv = '﻿' + [head].concat(rows).map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = '鍵盤勇者進度.csv'; a.click();
}
function teacherSem(k) { pickGrade = Number(k[0]); pickSem = Number(k[2]); usePack(pickGrade, pickSem); $('tq').innerHTML = QUESTS.map((q, i) => `<option value="${i}">${i + 1}. ${q.t}</option>`).join(''); }
function teacherDemo() {
  const q = Number($('tq').value);
  me = newProfile(pickGrade, pickSem, '老師', 0, '老師', 1);
  Object.assign(me, { quest: q, lv: 1 + q, gold: 500, weapons: WEAPON_ORDER.slice(), items: { potion: 5, meal: 2, hourglass: 2, bomb: 2 } });
  me.hp = maxHp(me); me.flags = Object.assign({ intro: 1, tutBattle: 1 }, bossFlagsUpTo(q));
  me.area = PACK.home;
  saveMe(); startGame();
}
function teacherLocal() {
  const list = Object.values(profiles).sort((a, b) => a.id.localeCompare(b.id));
  $('tlocal').innerHTML = list.length ? `<table class="t"><tr><th>年級學期</th><th>班級</th><th>座號</th><th>名字</th><th>等級</th><th>任務進度</th><th>通關密碼</th><th></th></tr>${list.map(p => `<tr><td>${p.grade}${SEM_NAME[p.sem]}</td><td>${esc(p.cls)}</td><td>${p.seat}</td><td>${esc(p.name)}</td><td>${p.lv}</td><td>${p.quest}/${qOf(p).length - 1}</td><td style="font-family:Consolas,monospace">${makeCode(p)}</td><td><button class="pbtn small red" onclick="teacherDel('${esc(p.id)}')">🗑️ 刪除</button></td></tr>`).join('')}</table>`
    : '<div style="font-weight:800">這台電腦還沒有勇者資料。</div>';
}
async function teacherDel(id) {
  const p = profiles[id]; if (!p) return;
  if (!(await askBox({ title: '刪除勇者', text: `確定刪除「${p.grade}${SEM_NAME[p.sem]} ${esc(p.cls)} 班 ${p.seat} 號 ${esc(p.name)}」？<br>（刪除前可以先抄下他的通關密碼：${makeCode(p)}）`, ok: '刪除' }))) return;
  delete profiles[id]; LS.set('kr_profiles', profiles); toast('已刪除'); teacherLocal();
}
async function teacherClear() { if (!(await askBox({ title: '清除資料', text: '確定清除這台電腦所有勇者的資料？（學生的通關密碼還是能恢復進度）', ok: '清除' }))) return; profiles = {}; LS.set('kr_profiles', {}); toast('已清除'); showTitle(); }

// ---------- 按鍵分派 ----------
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (W && W.onRaw) W.onRaw(e);
  if (W && W.onKey) {
    if (/INPUT|TEXTAREA/.test(tag)) return;
    if (e.ctrlKey || e.altKey || e.metaKey || !GAME_CODE(e.code)) return;
    e.preventDefault(); if (e.repeat) return; W.onKey(e); return;
  }
  if (W && W.onRaw) return;
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) { if (e.key === 'Enter' && UI.enter && !e.isComposing) { e.preventDefault(); UI.enter(); } return; }
  if (UI.dialogOpen) { if (['Space', 'Enter', 'NumpadEnter', 'ArrowUp', 'KeyE', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat && UI.dialogNext) UI.dialogNext(); } return; }
  if ($('modal').innerHTML) { if ((e.code === 'Escape' || e.code === 'KeyB' || e.code === 'KeyQ' || e.code === 'KeyM') && !window.closeBoard) closeModal(); else if (e.code === 'Escape' && window.closeBoard) closeBoard(); return; }
  if (e.key === 'Enter' && UI.enter && !world.visible) { e.preventDefault(); UI.enter(); return; }
  if (e.key === 'Enter' && UI.enter && $('ov').innerHTML) { e.preventDefault(); UI.enter(); return; }
  if (world.visible) { KEYS[e.code] = true; worldKeyDown(e); }
});
document.addEventListener('keyup', e => { KEYS[e.code] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
document.addEventListener('contextmenu', e => { if (world.visible || $('ov').innerHTML) e.preventDefault(); });


const OFFLINE_TITLE = showTitle, OFFLINE_TEACHER = showTeacher;

// ---------- 開始 ----------
fitStage();
(window.BOOT || showTitle)();

</script>
